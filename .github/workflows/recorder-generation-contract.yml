name: Recorder generation contract

on:
  push:
    branches: [master]
    paths:
      - 'automation/recorder*'
      - 'polyfills/006-ui.js'
      - 'polyfills/011-ui-targets.js'
      - 'types/UI*.d.ts'
      - 'types/recorder.d.ts'
      - 'apps/opendesk/recorder/**'
      - 'internal/recorderbundle/**'
      - 'workflows/agent-to-recipe/**'
      - 'workflows/human-to-recipe/**'
      - 'tests/runtime-api/**'
      - '.github/workflows/recorder-generation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Static and product tests
        shell: pwsh
        run: |
          node --check polyfills/006-ui.js
          node --check polyfills/011-ui-targets.js
          node --test tests/app-lifecycle/recorder-controller-core.test.js tests/human-to-recipe/recorder-script-refiner.test.js
          node tests/custom-ui/recording-history.test.js
      - name: Runtime contract
        shell: pwsh
        run: |
          go build -o .runtime/opendesk.exe ./cmd/opendesk
          & ./.runtime/opendesk.exe -script tests/runtime-api/recorder-generation.js -console-mode script
