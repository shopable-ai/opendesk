name: Browser Native Messaging Go bridge

on:
  push:
    paths:
      - "internal/browserbridge/**"
      - "internal/browserai/**"
      - "internal/browsercli/**"
      - "cmd/opendesk/main.go"
      - ".github/workflows/browser-native-bridge.yml"
  pull_request:
    paths:
      - "internal/browserbridge/**"
      - "internal/browserai/**"
      - "internal/browsercli/**"
      - "cmd/opendesk/main.go"
      - ".github/workflows/browser-native-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Native framing, authentication, socket and install tests
        run: go test -v -timeout=90s -count=1 ./internal/browserbridge ./internal/browsercli ./internal/browserai

  installed-macos-host:
    name: Real OpenDesk executable against simulated Chrome
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the same distributable binary used by App Mode
        shell: bash
        run: APP_MODE_PACKAGE= SKIP_CODESIGN=1 ./scripts/build_macos_app.sh
      - uses: actions/checkout@v4
        with:
          repository: shopable-ai/opendesk-browser
          # Immutable Browser fixture: Go hello asserts R16 + local-files capabilities.
          ref: 7f87dc2a08b70419e7e2a37d7f53da31bdabdd6c
          path: opendesk-browser-fixture
      - name: Chrome Native framing, installer and CLI process smoke
        shell: bash
        env:
          OPENDESK_BROWSER_BINARY: ${{ github.workspace }}/dist/OpenDesk.app/Contents/MacOS/opendesk
        run: node --test opendesk-browser-fixture/tests/environment/opendesk-native-provider.test.mjs
