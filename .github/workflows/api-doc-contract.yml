name: API docs contract

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-doc-contract:
    name: Canonical API docs contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate API documentation contract
        run: node scripts/check_api_docs_contract.js
      - name: Validate product JavaScript syntax
        run: |
          node --check apps/opendesk/flow-runner.js
          node --check apps/opendesk/scheduler-center.js
          node --check jslibs/js-yaml-5.4.1.opendesk.js
          node --check jslibs/papaparse-5.7.0.min.js
          node --check jslibs/zz-runtime-library-aliases.js
      - name: Test API-adjacent documentation consumers
        run: node --test tests/app-package/app-builder-docs.test.js
  agent-to-recipe-chain:
    name: Agent-to-Recipe capability chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact checked source and test environment
        run: |
          mkdir -p .runtime/tests/agent-to-recipe
          git rev-parse HEAD > .runtime/tests/agent-to-recipe/source-head.txt
          git status --short > .runtime/tests/agent-to-recipe/worktree-status.txt
          node --version > .runtime/tests/agent-to-recipe/node-version.txt
          uname -a > .runtime/tests/agent-to-recipe/environment.txt
          git archive --format=tar HEAD AGENTS.md workflows tests/workflows tests/agent-to-recipe examples/agent-to-recipe docs/frameworks docs/quality docs/api docs/architecture .github/workflows/api-doc-contract.yml > .runtime/tests/agent-to-recipe/source.tar
          printf '%s\n' 'Validator and input/output contract tests only; not Producer/model behavior, host loading, visual acceptance or real desktop qualification.' > .runtime/tests/agent-to-recipe/scope.txt
      - name: Validate workflow and golden Recipe syntax
        run: |
          node --check workflows/agent-to-recipe/scripts/check-artifact-chain.js
          node --check examples/agent-to-recipe/calculator.js
      - name: Test handoff and artifact-chain relationships
        shell: bash
        run: |
          set -o pipefail
          node --test tests/workflows/handoff-integrity.test.js tests/workflows/artifact-*.test.js 2>&1 | tee .runtime/tests/agent-to-recipe/contracts.tap
      - name: Test Calculator display resolver data path
        run: node tests/runtime-api/ui-perception-resolver.unit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-to-recipe-contract-evidence
          path: .runtime/tests/agent-to-recipe/
          if-no-files-found: error
          retention-days: 7
  runtime-api-formal:
    name: OpenDesk Runtime contract and unit (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build OpenDesk Runtime entry binary
        run: |
          mkdir -p dist
          go build -o dist/opendesk ./cmd/opendesk
      - name: Run bundled data library examples
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .runtime/tests/bundled-libraries
          ./dist/opendesk -script examples/runtime/yaml.js -console-mode script 2>&1 | tee .runtime/tests/bundled-libraries/yaml-example.log
          grep -F 'YAML_EXAMPLE_OK' .runtime/tests/bundled-libraries/yaml-example.log
          ./dist/opendesk -script examples/runtime/csv.js -console-mode script 2>&1 | tee .runtime/tests/bundled-libraries/csv-example.log
          grep -F 'CSV_EXAMPLE_OK' .runtime/tests/bundled-libraries/csv-example.log
      - name: Run bundled JavaScript library Runtime smoke
        run: ./dist/opendesk -script tests/runtime-api/single/window-library.js -console-mode script
      - name: Run formal Runtime contract gate
        run: OPENDESK_RUNTIME_API_MODE=contract ./dist/opendesk -script scripts/test_runtime_apis.js -console-mode script
      - name: Run formal Runtime unit gate
        run: OPENDESK_RUNTIME_API_MODE=unit ./dist/opendesk -script scripts/test_runtime_apis.js -console-mode script
      - name: Run Calculator-relevant selected Runtime units
        if: always()
        run: |
          OPENDESK_RUNTIME_API_MODE=unit-selected \
          OPENDESK_RUNTIME_API_UNIT_FILTER=window-target,ui-target-sequence,ui-semantic-targets,ui-semantic-targets-cancel,accessibility \
          ./dist/opendesk -script scripts/test_runtime_apis.js -console-mode script
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-api-formal-evidence
          path: .runtime/tests/runtime-api/
          if-no-files-found: warn
          retention-days: 7
  agent-api-reading:
    name: Layered Agent API reading
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate checked-in catalogs without regenerating them
        shell: bash
        run: |
          mkdir -p .runtime/tests/api-docs
          node scripts/api-docs.js check | tee .runtime/tests/api-docs/ci-check.json
      - name: Test canonical reading dependencies
        if: always()
        shell: bash
        run: |
          mkdir -p .runtime/tests/api-docs
          node --test tests/api-docs/reader.test.js | tee .runtime/tests/api-docs/ci-reader.tap
      - name: Test task-first discovery and local repair
        if: always()
        shell: bash
        run: |
          mkdir -p .runtime/tests/api-docs
          node --test tests/api-docs/discovery.test.js | tee .runtime/tests/api-docs/ci-discovery.tap
      - name: Verify catalog regeneration is deterministic
        if: always()
        run: |
          node scripts/api-docs.js generate
          git diff --exit-code -- docs/api/agent
          node scripts/api-docs.js generate
          git diff --exit-code -- docs/api/agent
          test -z "$(git ls-files --others --exclude-standard docs/api/agent)"
      - name: Record source and retired JSON references
        if: always()
        run: |
          mkdir -p .runtime/tests/api-docs
          git rev-parse HEAD | tee .runtime/tests/api-docs/source-head.txt
          git status --short | tee .runtime/tests/api-docs/worktree-status.txt
          git diff --check
          git diff --check HEAD^ HEAD
          test ! -e docs/api/runtime-api.ai.json
          git grep -n -F 'runtime-api.ai.json' > .runtime/tests/api-docs/retired-json-references.txt || test $? = 1
          git grep -n -E 'runtime-api.ai.json|preferredForAI' -- '*.go' '*.js' '*.json' > .runtime/tests/api-docs/retired-json-program-references.txt || test $? = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-api-reading-evidence
          path: .runtime/tests/api-docs/
          retention-days: 7
