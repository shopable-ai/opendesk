name: API docs contract

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-doc-contract:
    name: Canonical API docs and machine index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate API documentation contract
        run: node scripts/check_api_docs_contract.js
      - name: Validate product JavaScript syntax
        run: |
          node --check apps/opendesk/script-runner-simple.js
          node --check apps/opendesk/scheduler-center.js
  agent-api-reading:
    name: Layered Agent API reading
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate checked-in catalogs without regenerating them
        run: |
          mkdir -p .runtime/tests/api-docs
          node scripts/api-docs.js check > .runtime/tests/api-docs/ci-check.json
      - name: Test reading dependencies and discovery demonstrations
        if: always()
        run: node --test tests/api-docs/reader.test.js > .runtime/tests/api-docs/ci-tests.tap
      - name: Record source and current JSON consumers
        if: always()
        run: |
          mkdir -p .runtime/tests/api-docs
          git rev-parse HEAD > .runtime/tests/api-docs/source-head.txt
          git status --short > .runtime/tests/api-docs/worktree-status.txt
          git diff --check
          git grep -n -F 'runtime-api.ai.json' > .runtime/tests/api-docs/json-consumers.txt || test $? = 1
          git grep -n -E 'runtime-api.ai.json|preferredForAI' -- '*.go' '*.js' '*.json' > .runtime/tests/api-docs/program-consumers.txt || test $? = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-api-reading-evidence
          path: .runtime/tests/api-docs/
          retention-days: 7
