name: API docs contract
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-doc-contract:
    name: Canonical API docs and machine index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate API documentation contract
        run: node scripts/check_api_docs_contract.js
      - name: Validate product JavaScript syntax
        run: |
          node --check apps/opendesk/script-runner-simple.js
          node --check apps/opendesk/scheduler-center.js
  prepare-final-links:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'ci(docs): prepare final reading entry links'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare guarded documentation blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime/tests/api-docs-final-links
          python3 - <<'PY'
          import pathlib,os,json,urllib.request,hashlib,subprocess
          root=pathlib.Path.cwd();out=root/'.runtime/tests/api-docs-final-links';items=[]
          old='```text\ndocs/api/index.md\ndocs/api/cookbook.md\ndocs/api/runtime-api.ai.json\n```'
          new='```text\ndocs/api/agent/README.md\ndocs/api/index.md\ndocs/api/cookbook.md\n```\n\nAgent 从 `docs/api/agent/README.md` 按当前业务步骤展开；用户总导航与 Cookbook 按需读取，不是顺序必读清单。`docs/api/runtime-api.ai.json` 保留程序解析与校验用途，不作为默认全文阅读输入。'
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          for rel,expected in [('README.md','c2e85af8a903cea0a9e78f85100bba63814038ab'),('QUICKSTART.md','df26074cc5441d435303e821f452aa56efe3bc94')]:
            p=root/rel;raw=p.read_bytes();actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            if actual!=expected:raise RuntimeError('Concurrent source change: '+rel)
            text=raw.decode('utf8')
            if text.count(old)!=1:raise RuntimeError('Reading list not unique: '+rel)
            text=text.replace(old,new);p.write_text(text,encoding='utf8');(out/rel).write_text(text,encoding='utf8')
            request=urllib.request.Request(api,data=json.dumps({'content':text,'encoding':'utf-8'}).encode(),headers=headers,method='POST')
            response=json.load(urllib.request.urlopen(request))
            items.append({'path':rel,'mode':'100644','type':'blob','sha':response['sha'],'expected':expected,'sha256':hashlib.sha256(text.encode()).hexdigest()})
          (out/'blob-manifest.json').write_text(json.dumps({'base':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'entries':items},indent=2))
          PY
          git diff --check
          git diff > .runtime/tests/api-docs-final-links/change.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-api-final-links
          path: .runtime/tests/api-docs-final-links/
          retention-days: 3
