name: Measurement Web Baseline Transaction
on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/measurement-baseline-transaction.py'
      - '.github/scripts/measurement-browser.test.py'
      - '.github/scripts/measurement-publish-tree.py'
      - '.github/workflows/measurement-baseline-transaction.yml'
permissions:
  contents: write
jobs:
  reviewed-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve inspected source and apply fail-closed changes
        id: apply
        run: |
          mkdir -p .runtime/measurement-web-transaction
          tar -czf .runtime/measurement-web-transaction/reviewed-source.tar.gz pkg/measurement pkg/customui tests/desktop-measurement apps/opendesk/prototypes/desktop-measurement docs/architecture/desktop-automation/desktop-measurement.md docs/quality/desktop-measurement-qualification.md go.mod go.sum
          python .github/scripts/measurement-baseline-transaction.py
          python - <<'PY'
          import json, subprocess
          paths = json.load(open('.runtime/measurement-web-transaction/changed.json'))
          go = [p for p in paths if p.endswith('.go')]
          if go: subprocess.run(['gofmt', '-w', *go], check=True)
          PY
          git diff --check
      - name: Install synthetic browser test dependency
        if: steps.apply.outcome == 'success'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run independent source and synthetic test layers
        if: steps.apply.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path('.runtime/measurement-web-transaction')
          results = []
          for name, args, extra in [
              ('javascript-syntax',['node','--check','apps/opendesk/prototypes/desktop-measurement/interaction-core.js'],{}),
              ('prototype-model',['node','--test','tests/desktop-measurement/model.test.js'],{}),
              ('prototype-browser',['python','tests/desktop-measurement/browser.test.py'],{}),
              ('measurement',['go','test','./pkg/measurement/...','-count=1'],{'CGO_ENABLED':'0'}),
              ('customui',['go','test','./pkg/customui/...','-count=1'],{'CGO_ENABLED':'0'}),
          ]:
              try:
                  with (out/(name+'.log')).open('w') as log:
                      run = subprocess.run(args, env={**os.environ,**extra}, stdout=log, stderr=subprocess.STDOUT, timeout=240)
                  status = 'PASS_AUTOMATED' if run.returncode == 0 else 'FAIL'
              except subprocess.TimeoutExpired:
                  status = 'FAIL_TIMEOUT'
              results.append({'name':name,'command':args,'status':status,'nativeEvidence':False})
          (out/'test-results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Publish Git objects for explicit review, not a ref
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff > .runtime/measurement-web-transaction/source.patch
          python .github/scripts/measurement-publish-tree.py
      - name: Upload actual source and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-web-baseline-${{ github.sha }}
          path: .runtime/measurement-web-transaction
          include-hidden-files: true
          retention-days: 7
