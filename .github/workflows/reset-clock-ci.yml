name: Reset Clock Standalone R2

on:
  push:
    branches: [master]
    paths:
      - 'examples/desktop-reset-clock/**'
      - '.github/workflows/reset-clock-ci.yml'
  workflow_dispatch:

concurrency:
  group: reset-clock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/desktop-reset-clock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Test independent Go module
        run: go test ./... -count=1
      - name: Vet independent Go module
        run: go vet ./...
      - name: Build native client
        run: go build ./cmd/desktop-reset-clock
      - name: Build Go Feed Bridge
        run: go build ./cmd/reset-clock-bridge
      - name: Package unsigned AppKit development bundle
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-app.sh

  race-and-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/desktop-reset-clock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Race detector
        run: go test -race ./... -count=1
      - name: Windows amd64 cross-build
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ../../.runtime-reset-clock-windows.exe ./cmd/desktop-reset-clock
      - name: macOS arm64 non-CGO fallback build
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o ../../.runtime-reset-clock-mac-fallback ./cmd/desktop-reset-clock

  preview-browser:
    name: R2.2 Chromium visual oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Render and check R2.2 source prototype
        run: python examples/desktop-reset-clock/tests/r22_browser_test.py
      - name: Verify approved C3 artwork identity and render source layout
        run: python examples/desktop-reset-clock/tests/r23_c3_browser_test.py
      - name: Upload approved C3 browser reference, not native screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-clock-r23-c3-browser-evidence
          path: .runtime/tests/desktop-reset-clock/c3
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve visual evidence without committing runtime data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-clock-r22-browser-evidence
          path: .runtime/tests/desktop-reset-clock/r22
          if-no-files-found: ignore
          retention-days: 7
