name: Flow Runner Migration

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/flow-runner-migration.yml'
      - '.github/flow-runner-migrate.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-runner-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate, test, build, commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply migration
        run: python3 .github/flow-runner-migrate.py

      - name: Static migration audit
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/opendesk/flow-runner.js
          node --check apps/opendesk/flow-runner/controller.js
          node --check apps/opendesk/flow-runner/player-controller.js
          node --check apps/opendesk/flow-runner/shortcut-controller.js
          node --check apps/opendesk/main.js
          node --check apps/opendesk/runtime-log.js
          git diff --check
          test ! -e apps/opendesk/script-runner
          test ! -e apps/opendesk/script-runner-simple.js
          test -e apps/opendesk/script-runner-v1
          if git grep -nE 'OpenDeskScriptRunner|installOpenDeskScriptRunner|SCRIPT_RUNNER_|scriptRunner|ScriptRunner|apps/opendesk/script-runner/' -- apps/opendesk ':!apps/opendesk/script-runner-v1/**' ':!apps/opendesk/flow-runner.js' ':!apps/opendesk/runtime-log.js'; then
            echo 'Unexpected legacy Script Runner identity remains in active production source.' >&2
            exit 1
          fi
          echo 'Allowed compatibility references:'
          git grep -nE 'OPENDESK_SCRIPT_RUNNER_DIR|script-runner-simple' -- apps/opendesk/flow-runner.js apps/opendesk/runtime-log.js docs/architecture/execution/flow-runner.md apps/opendesk/flow-runner/README.md || true

      - name: Flow Runner JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runner_tests < <(find tests -type f -name '*flow-runner*.test.js' | sort)
          printf 'Runner tests:\n%s\n' "${runner_tests[*]}"
          test "${#runner_tests[@]}" -gt 0
          node --test "${runner_tests[@]}" tests/app-lifecycle/official-shell.test.js tests/app-lifecycle/examples-menu-action.test.js

      - name: Recorder interaction tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t recorder_tests < <(find tests/custom-ui -maxdepth 1 -type f -name 'recording-history*.test.js' | sort)
          test "${#recorder_tests[@]}" -gt 0
          node --test "${recorder_tests[@]}"

      - name: Go tests
        run: go test ./...

      - name: JavaScript lint
        run: npm run lint --if-present

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          go build ./...

      - name: Commit migration safely to master
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/flow-runner-migration.yml .github/flow-runner-migrate.py
          git add -A
          git diff --cached --check
          git config user.name 'OpenDesk Migration Bot'
          git config user.email 'opendesk-migration@users.noreply.github.com'
          git commit -m 'refactor(opendesk): migrate Script Runner to Flow Runner'
          git fetch origin master
          actual="$(git rev-parse origin/master)"
          if [ "$actual" != "$EXPECTED_HEAD" ]; then
            echo "master advanced during migration: expected $EXPECTED_HEAD, got $actual" >&2
            exit 42
          fi
          git push origin HEAD:master
