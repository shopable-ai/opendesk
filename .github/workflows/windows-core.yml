name: Windows Core

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Windows Core Compatibility
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare Windows evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .runtime/tests/windows-compat | Out-Null

      - name: Compile maintained Go source
        shell: pwsh
        run: go build ./...

      - name: Run deterministic Custom UI seams
        shell: pwsh
        run: go test ./pkg/customui/...

      - name: Run deterministic Window Manager seams
        shell: pwsh
        run: go test ./automation -run '^TestWindowsWindowManager' -count=1

      - name: Build OpenDesk Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -o dist/opendesk.exe ./cmd/opendesk
          if (-not (Test-Path -LiteralPath "dist/opendesk.exe")) {
            throw "dist/opendesk.exe was not produced"
          }

      - name: Run public Runtime window contract
        shell: pwsh
        run: |
          & .\dist\opendesk.exe -script "tests/runtime-api/window-target.js" -console-mode script *>&1 | Tee-Object -FilePath ".runtime/tests/windows-compat/window-runtime-contract.log"
          $exitCode = $LASTEXITCODE
          [ordered]@{
            schemaVersion = 1
            suite = "runtime-window-contract"
            status = if ($exitCode -eq 0) { "passed" } else { "failed" }
            command = ".\\dist\\opendesk.exe -script tests/runtime-api/window-target.js -console-mode script"
            githubSHA = $env:GITHUB_SHA
            osVersion = [Environment]::OSVersion.VersionString
            architecture = $env:PROCESSOR_ARCHITECTURE
            recordedAt = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath ".runtime/tests/windows-compat/window-runtime-contract.json" -Encoding UTF8
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build repository-owned Windows window fixture
        shell: pwsh
        run: |
          go build -o .runtime/tests/windows-compat/window-fixture.exe ./tests/windows/window-fixture
          if (-not (Test-Path -LiteralPath ".runtime/tests/windows-compat/window-fixture.exe")) {
            throw "repository-owned Windows window fixture was not produced"
          }

      - name: Run hosted live Window Manager fixture contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/windows/window-manager/run-live.ps1 -OpenDeskPath .\dist\opendesk.exe -FixturePath .\.runtime\tests\windows-compat\window-fixture.exe

      - name: Build complete Windows app pair
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build_windows_app.ps1

      - name: Windows hosted-deterministic native host protocol smoke
        shell: pwsh
        run: |
          $hostPath = ".\dist\ui-host\opendesk-ui-host.exe"
          if (-not (Test-Path -LiteralPath $hostPath)) {
            throw "Windows native UI host was not produced at $hostPath"
          }
          node tests/custom-ui/tools/native-host-smoke.cjs $hostPath --profile=hosted-deterministic
          $exitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath ".runtime/tests/native-ui/protocol-smoke.json") {
            Copy-Item -LiteralPath ".runtime/tests/native-ui/protocol-smoke.json" -Destination ".runtime/tests/windows-compat/native-host-protocol.json" -Force
          }
          if (Test-Path -LiteralPath ".runtime/tests/native-ui/protocol-smoke-error.json") {
            Copy-Item -LiteralPath ".runtime/tests/native-ui/protocol-smoke-error.json" -Destination ".runtime/tests/windows-compat/native-host-protocol-error.json" -Force
          }
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Audit test architecture
        if: always()
        shell: pwsh
        run: node scripts/audit_test_architecture.js

      - name: Upload Windows compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-evidence
          path: .runtime/tests/windows-compat
          if-no-files-found: ignore
          retention-days: 7
