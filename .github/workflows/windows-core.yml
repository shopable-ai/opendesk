name: Windows Core

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Windows Core Compatibility
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare Windows evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .runtime/tests/windows-compat | Out-Null

      - name: Compile maintained Go source
        shell: pwsh
        run: go build ./...

      - name: Test permission domain and CLI seams
        shell: pwsh
        run: |
          go test ./automation -run '^(TestAggregatePermissionOverall|TestPermissionFeatureRequirements|TestParsePermissionID|TestPermissionProviderAbstractionFeedsDomainModel)$' -count=1
          go test ./cmd/opendesk -run '^TestPermissions' -count=1

      - name: Test built-in Recorder resource bundle
        shell: pwsh
        run: go test ./internal/recorderbundle -count=1

      - name: Run Scheduler store concurrency tests
        shell: pwsh
        run: go test ./pkg/scheduler ./tests/scheduler -count=1

      - name: Run Scheduler multi-runtime ownership harness
        shell: pwsh
        run: go run ./tests/scheduler/tools/multiruntime

      - name: Run deterministic Custom UI seams
        shell: pwsh
        run: go test ./pkg/customui/...

      - name: Test App Package developer tooling
        shell: pwsh
        run: go test ./internal/appcli ./pkg/appshell -count=1

      - name: Run deterministic Window Manager seams
        shell: pwsh
        run: go test ./automation -run '^TestWindowsWindowManager' -count=1

      - name: Build portable Windows distribution
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build_windows_distribution.ps1 -Runtime win-x64 -AppModePackage apps/opendesk

      - name: Verify product App Mode resources in Windows distribution
        shell: pwsh
        run: |
          $distribution = ".\dist\windows\win-x64"
          $required = @(
            "app-mode\opendesk.app.json",
            "app-mode\main.js",
            "app-mode\permissions-center.js",
            "app-mode\runtime-log.js",
            "app-mode\recorder\controller.js",
            "app-mode\recorder\controller-core.js",
            "app-mode\recorder\recording-history.js",
            "app-mode\recorder\icons\countdown-1.png",
            "app-mode\recorder\icons\countdown-2.png",
            "app-mode\recorder\icons\countdown-3.png"
          )
          foreach ($relative in $required) {
            $path = Join-Path $distribution $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Windows distribution is missing product App Mode resource: $relative"
            }
          }
          $provenance = Get-Content -LiteralPath (Join-Path $distribution "distribution-provenance.json") -Raw | ConvertFrom-Json
          if ($provenance.layout.appModePackage -ne "app-mode/") {
            throw "Windows distribution provenance does not declare the staged product App Mode package."
          }

      - name: Validate maintained App Mode packages through the Windows CLI
        shell: pwsh
        run: |
          $runtime = ".\dist\windows\win-x64\opendesk.exe"
          & $runtime app validate examples/app-mode/basic --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime app validate apps/opendesk --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows permission CLI contract from distribution
        shell: pwsh
        run: |
          $runtime = ".\dist\windows\win-x64\opendesk.exe"
          $evidence = ".runtime/tests/windows-compat/permissions-status.json"
          & $runtime permissions status --json | Tee-Object -FilePath $evidence
          if ($LASTEXITCODE -ne 0) {
            throw "permissions status --json failed with exit code $LASTEXITCODE"
          }
          $report = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if ($report.platform -ne "windows") {
            throw "permission report platform must be windows"
          }
          if ($report.identity.launchKind -ne "windows-process") {
            throw "permission report must describe the current Windows process identity"
          }
          if (-not $report.permissions -or $report.permissions.Count -lt 1) {
            throw "permission report must contain permission entries"
          }
          foreach ($permission in $report.permissions) {
            if ($permission.status -ne "not_required") {
              throw "Windows permission $($permission.id) must use not_required instead of fake macOS TCC semantics"
            }
          }

      - name: Run public Runtime window contract from distribution
        shell: pwsh
        run: |
          $runtime = ".\dist\windows\win-x64\opendesk.exe"
          & $runtime -script "tests/runtime-api/window-target.js" -console-mode script *>&1 | Tee-Object -FilePath ".runtime/tests/windows-compat/window-runtime-contract.log"
          $exitCode = $LASTEXITCODE
          [ordered]@{
            schemaVersion = 1
            suite = "runtime-window-contract"
            status = if ($exitCode -eq 0) { "passed" } else { "failed" }
            command = ".\\dist\\windows\\win-x64\\opendesk.exe -script tests/runtime-api/window-target.js -console-mode script"
            githubSHA = $env:GITHUB_SHA
            osVersion = [Environment]::OSVersion.VersionString
            architecture = $env:PROCESSOR_ARCHITECTURE
            recordedAt = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath ".runtime/tests/windows-compat/window-runtime-contract.json" -Encoding UTF8
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build repository-owned Windows window fixture
        shell: pwsh
        run: |
          go build -o .runtime/tests/windows-compat/window-fixture.exe ./tests/windows/window-fixture
          if (-not (Test-Path -LiteralPath ".runtime/tests/windows-compat/window-fixture.exe")) {
            throw "repository-owned Windows window fixture was not produced"
          }

      - name: Run hosted live Window Manager fixture contract from distribution
        shell: pwsh
        run: pwsh -NoProfile -File tests/windows/window-manager/run-live.ps1 -OpenDeskPath .\dist\windows\win-x64\opendesk.exe -FixturePath .\.runtime\tests\windows-compat\window-fixture.exe

      - name: Windows hosted-deterministic native host protocol smoke from distribution
        shell: pwsh
        run: |
          $hostPath = ".\dist\windows\win-x64\ui-host\opendesk-ui-host.exe"
          if (-not (Test-Path -LiteralPath $hostPath)) {
            throw "Windows native UI host was not produced at $hostPath"
          }
          node tests/custom-ui/tools/native-host-smoke.cjs $hostPath --profile=hosted-deterministic
          $exitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath ".runtime/tests/native-ui/protocol-smoke.json") {
            Copy-Item -LiteralPath ".runtime/tests/native-ui/protocol-smoke.json" -Destination ".runtime/tests/windows-compat/native-host-protocol.json" -Force
          }
          if (Test-Path -LiteralPath ".runtime/tests/native-ui/protocol-smoke-error.json") {
            Copy-Item -LiteralPath ".runtime/tests/native-ui/protocol-smoke-error.json" -Destination ".runtime/tests/windows-compat/native-host-protocol-error.json" -Force
          }
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Validate portable distribution contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/windows/distribution/run-portable.ps1 -DistributionDirectory dist/windows/win-x64 -EvidenceDirectory .runtime/tests/windows-compat

      - name: Audit test architecture
        if: always()
        shell: pwsh
        run: node scripts/audit_test_architecture.js

      - name: Upload Windows compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-evidence
          path: .runtime/tests/windows-compat
          if-no-files-found: ignore
          retention-days: 7
