name: Reset Clock Public Source Probe

on:
  push:
    branches: [master]
    paths:
      - 'tests/desktop-reset-clock/tools/public-source-probe/**'
      - '.github/workflows/reset-clock-public-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fixed JSON shapes and mocked HTTP failures (never poll provider in CI)
        run: node --test tests/desktop-reset-clock/tools/public-source-probe/probe.test.mjs
      - name: Replay minimal public sample offline
        run: node tests/desktop-reset-clock/tools/public-source-probe/probe.mjs --fixture
