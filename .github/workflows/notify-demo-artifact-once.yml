name: Notify Demo Qualification Once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/notify-demo-artifact-once.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build current OpenDesk through the repository build owner
        run: make build

      - name: Prove raw JavaScript import does not run the business entry
        shell: bash
        run: |
          set -euo pipefail
          work="$PWD/.runtime/examples/notify-demo-qualification"
          rm -rf "$work"
          mkdir -p "$work/app-data"
          export OPENDESK_APP_DATA_DIR="$work/app-data"

          ./dist/opendesk flow install examples/flow-distribution/notify-demo/main.js | tee "$work/raw-install.json"
          ./dist/opendesk flow list | tee "$work/raw-list.json"

          grep -F '"origin":"js"' "$work/raw-list.json"
          if grep -Fq 'OpenDesk Notify Demo: notification requested after explicit run.' "$work/raw-install.json" "$work/raw-list.json"; then
            echo "Raw JavaScript import/list unexpectedly executed the business entry point." >&2
            exit 1
          fi

      - name: Run existing Flow installation zero-execution and tamper qualification
        shell: bash
        run: |
          set -euo pipefail
          ./dist/opendesk -script tests/runtime-api/flow-installation.js -console-mode script
