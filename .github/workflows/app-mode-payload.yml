name: App Mode Payload

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/app-mode-payload.yml'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - 'configs/product.json'
      - 'apps/opendesk/**'
      - 'apps/inspector_web/**'
      - 'internal/appmodepayload/**'
      - 'internal/inspectorwebpayload/**'
      - 'internal/officialassets/**'
      - 'internal/recorderbundle/**'
      - 'pkg/officialconfig/**'
      - 'scripts/build_macos_app.sh'
      - 'scripts/build_windows_app.ps1'
      - 'scripts/build_windows_distribution.ps1'
      - 'scripts/build_windows_ui.ps1'
      - 'scripts/tools/app-mode-payload/**'
      - 'scripts/tools/inspector-web-payload/**'
      - 'cmd/opendesk/**'
      - 'automation/app_shell.go'
      - 'automation/file.go'
      - 'automation/file_write_new_test.go'
      - 'automation/utils.go'
      - 'pkg/execution/**'
      - 'tests/assistant/**'
      - 'tests/runtime-api/assistant-task-core.js'
      - 'tests/runtime-api/gates/**'
      - 'cmd/opendesk-ui-host/**'
      - 'tests/app-lifecycle/official-shell.test.js'
      - 'tests/app-lifecycle/examples-menu-action.test.js'
      - 'docs/architecture/app-mode-desktop-launch.md'
  pull_request:
    paths:
      - '.github/workflows/app-mode-payload.yml'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - 'configs/product.json'
      - 'apps/opendesk/**'
      - 'apps/inspector_web/**'
      - 'internal/appmodepayload/**'
      - 'internal/inspectorwebpayload/**'
      - 'internal/officialassets/**'
      - 'internal/recorderbundle/**'
      - 'pkg/officialconfig/**'
      - 'scripts/build_macos_app.sh'
      - 'scripts/build_windows_app.ps1'
      - 'scripts/build_windows_distribution.ps1'
      - 'scripts/build_windows_ui.ps1'
      - 'scripts/tools/app-mode-payload/**'
      - 'scripts/tools/inspector-web-payload/**'
      - 'cmd/opendesk/**'
      - 'automation/app_shell.go'
      - 'automation/file.go'
      - 'automation/file_write_new_test.go'
      - 'automation/utils.go'
      - 'pkg/execution/**'
      - 'tests/assistant/**'
      - 'tests/runtime-api/assistant-task-core.js'
      - 'tests/runtime-api/gates/**'
      - 'cmd/opendesk-ui-host/**'
      - 'tests/app-lifecycle/official-shell.test.js'
      - 'tests/app-lifecycle/examples-menu-action.test.js'
      - 'docs/architecture/app-mode-desktop-launch.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Payload Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test payload staging and Recorder materialization
        run: go test ./internal/appmodepayload ./internal/inspectorwebpayload ./internal/recorderbundle -count=1
      - name: Test Official Shell and Product Runner contracts
        run: >-
          node --test
          tests/app-lifecycle/official-shell.test.js
          tests/app-lifecycle/examples-menu-action.test.js
          tests/custom-ui/product-flow-runner.test.js
      - name: Test AI assistant task and product contracts
        run: >-
          node --test
          tests/assistant/assistant.test.js
          tests/assistant/task-runtime.test.js
          tests/assistant/product-wiring.test.js
          tests/assistant/controller.test.js
          tests/custom-ui/product-flow-runner.test.js
          tests/assistant/model-channel-source.test.js
          tests/custom-ui/product-flow-runner.test.js
      - name: Test App-owned assistant execution seams
        run: go test ./cmd/opendesk -run 'TestAppRecipeRunner|TestAssistantInstalledFlowVerticalRuntime|TestLoadAppFlowInvocation' -count=1
      - name: Test Recorder JavaScript contracts
        run: >-
          node --test
          tests/custom-ui/recording-history.test.js
          tests/custom-ui/recording-history-icon-adapter.test.js
          tests/custom-ui/recording-history-interaction.test.js
          tests/custom-ui/recording-history-pagination.test.js
          tests/custom-ui/recording-history-presentation.test.js

  assistant-core:
    name: AI Assistant Core / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxtst-dev \
            libxinerama-dev
      - name: Test assistant JavaScript contracts
        run: >-
          node --test
          tests/assistant/assistant.test.js
          tests/assistant/task-runtime.test.js
          tests/assistant/product-wiring.test.js
          tests/assistant/controller.test.js
          tests/assistant/model-channel-source.test.js
      - name: Test assistant host and File safety seams
        run: >-
          go test ./automation ./cmd/opendesk
          -run 'TestFileWriteNew|TestFileRealPath|TestConfigureOfficialAppOwnedExecution|TestAppRecipeRunner|TestAssistantInstalledFlowVerticalRuntime|TestLoadAppFlowInvocation'
          -count=1
      - name: Build direct Runtime for assistant gate
        run: |
          mkdir -p .runtime/assistant-ci
          go build -trimpath -o .runtime/assistant-ci/opendesk ./cmd/opendesk
      - name: Run assistant direct Runtime acceptance
        run: ./.runtime/assistant-ci/opendesk -script tests/runtime-api/assistant-task-core.js -console-mode script
      - name: Run assistant formal Runtime gate
        run: OPENDESK_RUNTIME_API_MODE=assistant-task-core ./.runtime/assistant-ci/opendesk -script scripts/test_runtime_apis.js -console-mode script

  assistant-core-windows:
    name: AI Assistant Core / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test assistant JavaScript contracts
        shell: pwsh
        run: node --test tests/assistant/assistant.test.js tests/assistant/task-runtime.test.js tests/assistant/product-wiring.test.js tests/assistant/controller.test.js tests/assistant/model-channel-source.test.js
      - name: Test assistant host and File safety seams
        shell: pwsh
        run: go test ./automation ./cmd/opendesk -run 'TestFileWriteNew|TestFileRealPath|TestConfigureOfficialAppOwnedExecution|TestAppRecipeRunner|TestAssistantInstalledFlowVerticalRuntime|TestLoadAppFlowInvocation' -count=1
      - name: Build direct Runtime for assistant gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .runtime/assistant-ci | Out-Null
          go build -trimpath -o .runtime/assistant-ci/opendesk.exe ./cmd/opendesk
      - name: Run assistant direct Runtime acceptance
        shell: pwsh
        run: |
          & .\.runtime\assistant-ci\opendesk.exe -script tests/runtime-api/assistant-task-core.js -console-mode script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Formal Runtime gate harness is POSIX-only (shasum, /bin/test, cp/mv, uname).
      # Windows qualification uses the same production Runtime JS asset directly above.

  macos-package:
    name: macOS App Mode Payload
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build product app without release signing
        shell: bash
        run: APP_MODE_PACKAGE="$PWD/apps/opendesk" SKIP_CODESIGN=1 ./scripts/build_macos_app.sh
      - name: Run AI assistant direct Runtime acceptance
        shell: bash
        run: ./dist/opendesk -script tests/runtime-api/assistant-task-core.js -console-mode script
      - name: Run AI assistant formal Runtime gate
        shell: bash
        run: OPENDESK_RUNTIME_API_MODE=assistant-task-core ./dist/opendesk -script scripts/test_runtime_apis.js -console-mode script
      - name: Verify exact macOS App Mode payload
        shell: bash
        run: |
          set -euo pipefail
          distribution="dist/OpenDesk.app"
          payload="$distribution/Contents/Resources/AppMode"
          policy="apps/opendesk/.release/app-mode-runtime-files.txt"
          evidence=".runtime/tests/app-mode-payload/macos"
          mkdir -p "$evidence"
          awk 'NF && $1 !~ /^#/' "$policy" | LC_ALL=C sort > "$evidence/expected.txt"
          (cd "$payload" && find . -type f -print | sed 's#^./##' | LC_ALL=C sort) > "$evidence/actual.txt"
          diff -u "$evidence/expected.txt" "$evidence/actual.txt"
          for forbidden in README.md recorder/embed.go recorder/icons/render-countdown-icons.swift; do
            test ! -e "$payload/$forbidden" || { echo "development file leaked into macOS App Mode payload: $forbidden" >&2; exit 1; }
          done
          leaked_source="$(find "$payload" -type f \( -name '*.go' -o -name '*.swift' \) -print -quit)"
          test -z "$leaked_source" || { echo "build-time source leaked into macOS App Mode payload: $leaked_source" >&2; exit 1; }
          leaked_link="$(find "$payload" -type l -print -quit)"
          test -z "$leaked_link" || { echo "symlink leaked into macOS App Mode payload: $leaked_link" >&2; exit 1; }
          for forbidden_dir in examples tests docs workflows research; do
            leaked_dir="$(find "$distribution" -type d -name "$forbidden_dir" -print -quit)"
            test -z "$leaked_dir" || { echo "repository-only directory leaked into macOS distribution: $leaked_dir" >&2; exit 1; }
          done
          for relative in index.html assets/app.css assets/app.js assets/model.js; do
            test -f "$distribution/Contents/Resources/inspector_web/$relative" || { echo "macOS Inspector frontend asset is missing: $relative" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-mode-payload-macos
          path: .runtime/tests/app-mode-payload/macos
          if-no-files-found: ignore
          retention-days: 7

  windows-package:
    name: Windows App Mode Payload
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build portable product distribution
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build_windows_distribution.ps1 -Runtime win-x64 -AppModePackage apps/opendesk
      - name: Run AI assistant direct Runtime acceptance
        shell: pwsh
        run: |
          $runtime = '.\dist\windows\win-x64\opendesk.exe'
          & $runtime -script 'tests/runtime-api/assistant-task-core.js' -console-mode script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The catalog gate harness is POSIX-only; the direct production Runtime
      # acceptance above is the Windows Runtime qualification for this asset.
      - name: Verify exact Windows App Mode payload
        shell: pwsh
        run: |
          $distribution = [IO.Path]::GetFullPath(".\dist\windows\win-x64")
          $appMode = Join-Path $distribution "app-mode"
          $policy = ".\apps\opendesk\.release\app-mode-runtime-files.txt"
          $evidence = ".\.runtime\tests\app-mode-payload\windows"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $expected = @(Get-Content -LiteralPath $policy | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') } | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $appMode -File -Recurse | ForEach-Object { [IO.Path]::GetRelativePath($appMode, $_.FullName).Replace('\', '/') } | Sort-Object)
          $expected | Set-Content -LiteralPath (Join-Path $evidence "expected.txt") -Encoding utf8
          $actual | Set-Content -LiteralPath (Join-Path $evidence "actual.txt") -Encoding utf8
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($difference.Count -ne 0) {
            $difference | Format-Table | Out-String | Write-Host
            throw "Windows App Mode payload does not exactly match the shared release policy."
          }
          foreach ($relative in @("README.md", "recorder/embed.go", "recorder/icons/render-countdown-icons.swift")) {
            if (Test-Path -LiteralPath (Join-Path $appMode $relative)) {
              throw "Development file leaked into Windows App Mode payload: $relative"
            }
          }
          $leakedSource = @(Get-ChildItem -LiteralPath $appMode -File -Recurse | Where-Object { $_.Extension -in @('.go', '.swift') })
          if ($leakedSource.Count -ne 0) {
            throw "Build-time source leaked into Windows App Mode payload: $($leakedSource[0].FullName)"
          }
          $leakedLink = @(Get-ChildItem -LiteralPath $appMode -Recurse -Force | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
          if ($leakedLink.Count -ne 0) {
            throw "Reparse point/symlink leaked into Windows App Mode payload: $($leakedLink[0].FullName)"
          }
          foreach ($forbiddenDir in @('examples', 'tests', 'docs', 'workflows', 'research')) {
            $leakedDir = @(Get-ChildItem -LiteralPath $distribution -Directory -Recurse -Force | Where-Object { $_.Name -eq $forbiddenDir } | Select-Object -First 1)
            if ($leakedDir.Count -ne 0) {
              throw "Repository-only directory leaked into Windows distribution: $($leakedDir[0].FullName)"
            }
          }
          $provenance = Get-Content -LiteralPath (Join-Path $distribution "distribution-provenance.json") -Raw | ConvertFrom-Json
          if ($provenance.layout.appModePackage -ne "app-mode/") {
            throw "Windows distribution provenance does not declare the staged product App Mode package."
          }
          foreach ($relative in @("index.html", "assets/app.css", "assets/app.js", "assets/model.js")) {
            if (-not (Test-Path -LiteralPath (Join-Path $distribution "inspector_web/$relative") -PathType Leaf)) {
              throw "Windows Inspector frontend asset is missing: $relative"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-mode-payload-windows
          path: .runtime/tests/app-mode-payload/windows
          if-no-files-found: ignore
          retention-days: 7
