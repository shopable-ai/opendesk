name: Codex Workflow Companion core
on:
  push:
    branches: [master]
    paths:
      - 'examples/codex-workflow-companion/**'
      - 'tests/codex-workflow-companion/**'
      - '.github/workflows/codex-workflow-companion.yml'
  workflow_dispatch:
jobs:
  core-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix examples/codex-workflow-companion install --no-audit --no-fund
      - run: npm --prefix examples/codex-workflow-companion run typecheck
      - run: npm --prefix examples/codex-workflow-companion run build
      - run: npm --prefix examples/codex-workflow-companion test
      - uses: actions/upload-artifact@v4
        with:
          name: codex-workflow-companion-react-preview
          path: examples/codex-workflow-companion/preview/index.html
