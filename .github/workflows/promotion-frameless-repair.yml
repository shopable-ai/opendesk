name: Promotion frameless repair

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/promotion-frameless-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply cross-platform frameless window repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          replace('pkg/customui/model.go', 'const ProtocolVersion = "1.12.0"', 'const ProtocolVersion = "1.13.0"')
          replace(
              'pkg/customui/model.go',
              'Title            string           `json:"title,omitempty"`\n\tBounds           Bounds           `json:"bounds"`',
              'Title            string           `json:"title,omitempty"`\n\tChrome           string           `json:"chrome,omitempty"`\n\tBounds           Bounds           `json:"bounds"`',
          )

          replace(
              'automation/custom_ui.go',
              'Title string `json:"title,omitempty"`\n\t// Position is the public discriminated initial-position declaration.',
              'Title  string `json:"title,omitempty"`\n\tChrome string `json:"chrome,omitempty"`\n\t// Position is the public discriminated initial-position declaration.',
          )
          replace(
              'automation/custom_ui.go',
              'ID: declaration.ID, Kind: declaration.Kind, Title: declaration.Title,\n\t\tBounds: bounds, AlwaysOnTop: declaration.AlwaysOnTop,',
              'ID: declaration.ID, Kind: declaration.Kind, Title: declaration.Title, Chrome: declaration.Chrome,\n\t\tBounds: bounds, AlwaysOnTop: declaration.AlwaysOnTop,',
          )
          replace(
              'automation/custom_ui.go',
              '"position": false, "placement": false, "size": false, "alwaysOnTop": false, "draggable": false, "nativeIdentity": false, "notify": false',
              '"position": false, "placement": false, "size": false, "alwaysOnTop": false, "draggable": false, "chrome": false, "nativeIdentity": false, "notify": false',
          )

          replace(
              'pkg/customui/validate.go',
              '\tif spec.AppCloseBehavior != "" && spec.AppCloseBehavior != "hide" && spec.AppCloseBehavior != "quit" {\n\t\treturn WindowSpec{}, invalidSpec("app close behavior must be hide, quit, or omitted")\n\t}\n\tif spec.Placement != nil {',
              '\tif spec.AppCloseBehavior != "" && spec.AppCloseBehavior != "hide" && spec.AppCloseBehavior != "quit" {\n\t\treturn WindowSpec{}, invalidSpec("app close behavior must be hide, quit, or omitted")\n\t}\n\tspec.Chrome = strings.TrimSpace(spec.Chrome)\n\tif spec.Chrome == "" {\n\t\tspec.Chrome = "system"\n\t}\n\tif spec.Chrome != "system" && spec.Chrome != "none" {\n\t\treturn WindowSpec{}, &Error{Code: CodeUnsupportedCapability, Operation: "createWindow", Capability: "chrome", Message: "custom UI supports system or none window chrome"}\n\t}\n\tif spec.Chrome == "none" && (spec.Notification != nil || spec.Toolbar != nil) {\n\t\treturn WindowSpec{}, invalidSpec("chrome none is available only to floating HTML windows")\n\t}\n\tif spec.Placement != nil {',
          )
          replace(
              'pkg/customui/validate.go',
              '\tif spec.Kind != "normal" && spec.Kind != "floating" && spec.Kind != "measurement" {\n\t\treturn WindowSpec{}, invalidSpec("window kind must be normal, floating, or host-owned measurement")\n\t}\n\tif spec.Theme == "" {',
              '\tif spec.Kind != "normal" && spec.Kind != "floating" && spec.Kind != "measurement" {\n\t\treturn WindowSpec{}, invalidSpec("window kind must be normal, floating, or host-owned measurement")\n\t}\n\tif spec.Chrome == "none" && spec.Kind != "floating" {\n\t\treturn WindowSpec{}, invalidSpec("chrome none requires kind floating")\n\t}\n\tif spec.Theme == "" {',
          )

          replace(
              'pkg/customui/memory_driver.go',
              '"position": true, "placement": true, "size": true, "alwaysOnTop": true, "draggable": true, "notify": true',
              '"position": true, "placement": true, "size": true, "alwaysOnTop": true, "draggable": true, "chrome": true, "notify": true',
          )
          replace(
              'pkg/customui/process_driver.go',
              '"draggable": available, "keyEvents": available, "interactionGroup": available, "nativeIdentity": available, "notify": available,',
              '"draggable": available, "chrome": available, "keyEvents": available, "interactionGroup": available, "nativeIdentity": available, "notify": available,',
          )

          replace('pkg/customui/machost/native_darwin.m', 'static NSString *const CDProtocolVersion = @"1.12.0";', 'static NSString *const CDProtocolVersion = @"1.13.0";')
          replace(
              'pkg/customui/machost/native_darwin.m',
              '\tBOOL isMeasurement = [kind isEqualToString:@"measurement"];\n    NSWindowStyleMask style = NSWindowStyleMaskTitled | NSWindowStyleMaskClosable;\n\tif (!isHostDialog && !isNativeToolbar) style |= NSWindowStyleMaskResizable | NSWindowStyleMaskMiniaturizable;',
              '\tBOOL isMeasurement = [kind isEqualToString:@"measurement"];\n\tBOOL frameless = [spec[@"chrome"] isEqualToString:@"none"];\n    NSWindowStyleMask style = frameless ? NSWindowStyleMaskBorderless : (NSWindowStyleMaskTitled | NSWindowStyleMaskClosable);\n\tif (!frameless && !isHostDialog && !isNativeToolbar) style |= NSWindowStyleMaskResizable | NSWindowStyleMaskMiniaturizable;',
          )
          replace(
              'pkg/customui/machost/native_darwin.m',
              '\t} else if ([kind isEqualToString:@"floating"]) {\n\t\tNSWindowStyleMask panelStyle = toolbarNeedsKeyboard ? style : (style | NSWindowStyleMaskNonactivatingPanel);\n\t\tNSPanel *panel = [[NSPanel alloc] initWithContentRect:frame styleMask:panelStyle backing:NSBackingStoreBuffered defer:NO];\n        panel.collectionBehavior = NSWindowCollectionBehaviorCanJoinAllSpaces | NSWindowCollectionBehaviorFullScreenAuxiliary;\n\t\tpanel.floatingPanel = YES;\n\t\tpanel.becomesKeyOnlyIfNeeded = YES;\n\t\tpanel.hidesOnDeactivate = NO;\n        window = panel;',
              '\t} else if ([kind isEqualToString:@"floating"]) {\n\t\tNSWindowStyleMask panelStyle = frameless\n\t\t\t? (NSWindowStyleMaskBorderless | NSWindowStyleMaskNonactivatingPanel)\n\t\t\t: (toolbarNeedsKeyboard ? style : (style | NSWindowStyleMaskNonactivatingPanel));\n\t\tNSPanel *panel = [[NSPanel alloc] initWithContentRect:frame styleMask:panelStyle backing:NSBackingStoreBuffered defer:NO];\n        panel.collectionBehavior = NSWindowCollectionBehaviorCanJoinAllSpaces | NSWindowCollectionBehaviorFullScreenAuxiliary;\n\t\tpanel.floatingPanel = YES;\n\t\tpanel.becomesKeyOnlyIfNeeded = YES;\n\t\tpanel.hidesOnDeactivate = NO;\n\t\tif (frameless) {\n\t\t\tpanel.titleVisibility = NSWindowTitleHidden;\n\t\t\tpanel.titlebarAppearsTransparent = YES;\n\t\t\tpanel.hasShadow = YES;\n\t\t}\n        window = panel;',
          )

          replace('pkg/customui/winhost/Program.cs', 'internal const string Protocol = "1.12.0";', 'internal const string Protocol = "1.13.0";')
          replace(
              'pkg/customui/winhost/Host.cs',
              'bool floating=J.S(spec,"kind")=="floating", measurement=J.S(spec,"kind")=="measurement";\n        Form=new NativeForm { Text=measurement?"":J.S(spec,"title"),TopMost=J.B(spec,"alwaysOnTop")||J.B(spec,"centerOnActiveDisplay"),BackgroundDraggable=J.B(spec,"draggable"),ShowInTaskbar=!floating&&!measurement };',
              'string kind=J.S(spec,"kind");\n        bool floating=kind=="floating", measurement=kind=="measurement", frameless=floating&&J.S(spec,"chrome","system")=="none";\n        Form=new NativeForm { Text=measurement?"":J.S(spec,"title"),TopMost=J.B(spec,"alwaysOnTop")||J.B(spec,"centerOnActiveDisplay"),BackgroundDraggable=J.B(spec,"draggable"),ShowInTaskbar=!floating&&!measurement };\n        if(frameless)Form.FormBorderStyle=FormBorderStyle.None;',
          )

          replace(
              'apps/opendesk/promotions/controller.js',
              "kind:'floating',title:'OpenDesk · 推广',",
              "kind:'floating',chrome:'none',title:'OpenDesk · 推广',",
          )

          Path('pkg/customui/window_chrome_contract_test.go').write_text(r'''package customui

import (
    "os"
    "strings"
    "testing"
)

func TestNormalizeFloatingWindowChrome(t *testing.T) {
    base := t.TempDir()
    makeSpec := func(id, kind, chrome string) WindowSpec {
        return WindowSpec{
            ID: id, Kind: kind, Chrome: chrome,
            Bounds: Bounds{Width: 320, Height: 180},
            Content: ContentSpec{HTML: `<div id="content">ok</div>`},
        }
    }

    got, err := Normalize(makeSpec("promotion", "floating", "none"), base)
    if err != nil {
        t.Fatalf("normalize frameless floating window: %v", err)
    }
    if got.Chrome != "none" {
        t.Fatalf("chrome = %q, want none", got.Chrome)
    }

    got, err = Normalize(makeSpec("defaultChrome", "floating", ""), base)
    if err != nil {
        t.Fatalf("normalize default chrome: %v", err)
    }
    if got.Chrome != "system" {
        t.Fatalf("default chrome = %q, want system", got.Chrome)
    }

    if _, err := Normalize(makeSpec("normalFrameless", "normal", "none"), base); err == nil {
        t.Fatal("chrome none must be rejected for non-floating public windows")
    }
    if _, err := Normalize(makeSpec("badChrome", "floating", "transparent"), base); err == nil {
        t.Fatal("unknown chrome value must be rejected")
    }
}

func TestFramelessChromeNativeParity(t *testing.T) {
    cases := map[string]struct {
        path   string
        tokens []string
    }{
        "macos": {
            path: "machost/native_darwin.m",
            tokens: []string{
                `BOOL frameless = [spec[@"chrome"] isEqualToString:@"none"]`,
                `NSWindowStyleMaskBorderless | NSWindowStyleMaskNonactivatingPanel`,
                `panel.titleVisibility = NSWindowTitleHidden`,
            },
        },
        "windows": {
            path: "winhost/Host.cs",
            tokens: []string{
                `frameless=floating&&J.S(spec,"chrome","system")=="none"`,
                `Form.FormBorderStyle=FormBorderStyle.None`,
            },
        },
    }
    for name, tc := range cases {
        data, err := os.ReadFile(tc.path)
        if err != nil {
            t.Fatal(err)
        }
        source := string(data)
        for _, token := range tc.tokens {
            if !strings.Contains(source, token) {
                t.Fatalf("%s frameless host contract missing %q", name, token)
            }
        }
    }
}

func TestPromotionRequestsFramelessChrome(t *testing.T) {
    data, err := os.ReadFile("../../apps/opendesk/promotions/controller.js")
    if err != nil {
        t.Fatal(err)
    }
    source := string(data)
    if !strings.Contains(source, "kind:'floating',chrome:'none',title:'OpenDesk · 推广'") {
        t.Fatal("production Promotion controller must explicitly request chrome:none")
    }
}

func TestWindowChromeProtocolVersion(t *testing.T) {
    if ProtocolVersion != "1.13.0" {
        t.Fatalf("Go protocol = %q, want 1.13.0", ProtocolVersion)
    }
    for name, tc := range map[string]struct{ path, token string }{
        "macos": {"machost/native_darwin.m", `CDProtocolVersion = @"1.13.0"`},
        "windows": {"winhost/Program.cs", `Protocol = "1.13.0"`},
    } {
        data, err := os.ReadFile(tc.path)
        if err != nil {
            t.Fatal(err)
        }
        if !strings.Contains(string(data), tc.token) {
            t.Fatalf("%s native protocol is not synchronized to 1.13.0", name)
        }
    }
}
''')

          Path('automation/custom_ui_chrome_test.go').write_text(r'''package automation

import (
    "testing"

    "opendesk/pkg/customui"
)

func TestCustomUIWindowDeclarationCarriesChrome(t *testing.T) {
    bounds := customui.Bounds{Width: 320, Height: 180}
    declaration := customUIWindowDeclaration{
        ID: "promotionPreview",
        Kind: "floating",
        Title: "Promotion",
        Chrome: "none",
        Bounds: &bounds,
        Content: customUIContentDeclaration{HTML: `<div id="content">ok</div>`},
    }
    spec, err := declaration.windowSpec()
    if err != nil {
        t.Fatalf("windowSpec: %v", err)
    }
    if spec.Chrome != "none" {
        t.Fatalf("chrome = %q, want none", spec.Chrome)
    }
}
''')
          PY
          gofmt -w pkg/customui/model.go pkg/customui/validate.go pkg/customui/memory_driver.go pkg/customui/process_driver.go automation/custom_ui.go pkg/customui/window_chrome_contract_test.go automation/custom_ui_chrome_test.go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./pkg/customui -run 'WindowChrome|FramelessChrome|PromotionRequests|NormalizeFloating'
          go test ./automation -run 'CustomUIWindowDeclarationCarriesChrome'
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/promotion-frameless-repair.yml
          git add automation/custom_ui.go automation/custom_ui_chrome_test.go apps/opendesk/promotions/controller.js pkg/customui/model.go pkg/customui/validate.go pkg/customui/memory_driver.go pkg/customui/process_driver.go pkg/customui/machost/native_darwin.m pkg/customui/winhost/Host.cs pkg/customui/winhost/Program.cs pkg/customui/window_chrome_contract_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(promotions): remove native window chrome'
          git pull --rebase origin master
          git push origin master
