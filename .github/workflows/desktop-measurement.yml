name: Desktop Measurement

on:
  push:
    paths:
      - '.github/workflows/desktop-measurement.yml'
      - 'pkg/measurement/**'
      - 'pkg/customui/**'
      - 'pkg/recorder/measurement_evidence*'
      - 'apps/opendesk/prototypes/desktop-measurement/**'
      - 'tests/desktop-measurement/**'
      - 'docs/architecture/desktop-automation/desktop-measurement*'
      - 'docs/quality/desktop-measurement*'
      - 'workflows/agent-to-recipe/design/measurement-evidence.md'
  pull_request:
    paths:
      - '.github/workflows/desktop-measurement.yml'
      - 'pkg/measurement/**'
      - 'pkg/customui/**'
      - 'pkg/recorder/measurement_evidence*'
      - 'apps/opendesk/prototypes/desktop-measurement/**'
      - 'tests/desktop-measurement/**'
      - 'docs/architecture/desktop-automation/desktop-measurement*'
      - 'docs/quality/desktop-measurement*'
      - 'workflows/agent-to-recipe/design/measurement-evidence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-contracts:
    name: Production contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare contract evidence directory
        shell: bash
        run: mkdir -p .runtime/tests/desktop-measurement
      - name: Test Measurement core, authoring and repair
        shell: bash
        run: |
          set -o pipefail
          go test ./pkg/measurement/... -count=1 2>&1 | tee .runtime/tests/desktop-measurement/measurement-${RUNNER_OS}.log
      - name: Test CustomUI Measurement host contracts
        shell: bash
        run: |
          set -o pipefail
          go test ./pkg/customui/... -count=1 2>&1 | tee .runtime/tests/desktop-measurement/customui-${RUNNER_OS}.log
      - name: Test Recorder Measurement evidence integration
        shell: bash
        run: |
          set -o pipefail
          go test ./pkg/recorder/... -count=1 2>&1 | tee .runtime/tests/desktop-measurement/recorder-${RUNNER_OS}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-measurement-contracts-${{ runner.os }}
          path: .runtime/tests/desktop-measurement
          if-no-files-found: ignore
          retention-days: 7

  prototype-model:
    name: Prototype model oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/desktop-measurement/model.test.js

  prototype-browser:
    name: Prototype browser oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run browser interaction oracle
        run: python tests/desktop-measurement/browser.test.py
