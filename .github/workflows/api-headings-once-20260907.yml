name: One-time API heading verification

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/api-headings-once-20260907.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify parsed headings, examples and link destinations
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 5 --filter=blob:none --no-checkout --branch master "https://github.com/${REPOSITORY}.git" repo
          cd repo
          git sparse-checkout set --no-cone '/AGENTS.md' '/docs/api/'
          git checkout master
          python3 -m pip install --disable-pip-version-check --quiet 'markdown-it-py==4.0.0'
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          from markdown_it import MarkdownIt

          baseline = '95930b812e14f79e14ed3223df905dc58e708a9c'
          parser = MarkdownIt('commonmark')

          def without_frontmatter(text):
              return re.sub(r'\A---\r?\n.*?\r?\n(?:---|\.\.\.)\s*\r?\n', '', text, count=1, flags=re.S)

          def inspect(text):
              tokens = parser.parse(without_frontmatter(text))
              headings = []
              forbidden = []
              code_blocks = []
              body_code = []
              links = []
              for i, token in enumerate(tokens):
                  if token.type in ('fence', 'code_block'):
                      code_blocks.append((token.type, token.info, token.markup, token.content))
                  if token.type != 'inline':
                      continue
                  is_heading = i > 0 and tokens[i - 1].type == 'heading_open'
                  children = token.children or []
                  if is_heading:
                      visible = ''.join(child.content if child.type in ('text', 'code_inline', 'image') else '\n' if child.type in ('softbreak', 'hardbreak') else '' for child in children)
                      headings.append((tokens[i - 1].tag, visible))
                      if '`' in token.content or re.search(r'&(?:#0*96|#x0*60|grave);|</?code\b', token.content, re.I) or any(child.type == 'code_inline' for child in children):
                          forbidden.append(token.content)
                  else:
                      body_code.extend(child.content for child in children if child.type == 'code_inline')
                  links.extend(child.attrGet('href') for child in children if child.type == 'link_open')
                  links.extend(child.attrGet('src') for child in children if child.type == 'image')
              return headings, forbidden, code_blocks, body_code, links

          tracked = subprocess.check_output(['git', 'ls-files', '-z', '--', 'docs/api/']).decode().split('\0')
          files = [Path(name) for name in tracked if name and Path(name).suffix.lower() in ('.md', '.mdx', '.markdown')]
          total_headings = total_blocks = total_links = 0
          changed_files = []
          failures = []
          for path in files:
              before = subprocess.check_output(['git', 'show', baseline + ':' + str(path)]).decode('utf-8')
              after = path.read_bytes().decode('utf-8')
              original = inspect(before)
              updated = inspect(after)
              if before != after:
                  changed_files.append(str(path))
                  before_lines, after_lines = before.splitlines(), after.splitlines()
                  if len(before_lines) != len(after_lines) or any(old.replace('`', '') != new for old, new in zip(before_lines, after_lines) if old != new):
                      failures.append(str(path) + ': changes other than backtick removal')
              if updated[1]:
                  failures.append(str(path) + ': code markup remains in headings: ' + repr(updated[1]))
              for index, label in ((0, 'visible heading text or level'), (2, 'code block'), (3, 'body inline code'), (4, 'link or image destination')):
                  if original[index] != updated[index]:
                      failures.append(str(path) + ': ' + label + ' changed')
              total_headings += len(updated[0])
              total_blocks += len(updated[2])
              total_links += len(updated[4])
          if failures:
              raise SystemExit('\n'.join(failures))
          summary = '\n'.join([
              'Independent CommonMark parse: PASS',
              'Markdown files checked: ' + str(len(files)),
              'Modified API pages: ' + str(len(changed_files)),
              'Parsed headings checked: ' + str(total_headings),
              'Headings with code markup remaining: 0',
              'Visible heading text, levels and order: unchanged',
              'Fenced/indented code blocks preserved: ' + str(total_blocks),
              'Body inline code: unchanged',
              'Link/image destinations preserved: ' + str(total_links),
              'Every modified line differs only by removed backticks: PASS',
          ]) + '\n'
          print(summary)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('```text\n' + summary + '```\n', encoding='utf-8')
          PY
          git diff --check 95930b812e14f79e14ed3223df905dc58e708a9c HEAD -- docs/api/
          test -z "$(git status --porcelain -- docs/api/)"
