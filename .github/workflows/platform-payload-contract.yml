name: Platform payload contract fixtures
on:
  pull_request:
    paths:
      - 'scripts/verify_platform_payload.py'
      - 'tests/distribution/test_platform_payload.py'
      - '.github/workflows/platform-payload-contract.yml'
      - 'scripts/build_*'
      - 'internal/appbuilder/**'
      - 'docs/architecture/platform-distribution-capability-closure.md'
  push:
    branches: [master]
    paths:
      - 'scripts/verify_platform_payload.py'
      - 'tests/distribution/test_platform_payload.py'
      - '.github/workflows/platform-payload-contract.yml'
      - 'scripts/build_*'
      - 'internal/appbuilder/**'
      - 'docs/architecture/platform-distribution-capability-closure.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-contract:
    name: Static fixtures (${{ matrix.os }}), not native launch qualification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify missing-host and Runtime preservation regressions
        run: python -m unittest discover -s tests/distribution -p test_platform_payload.py -v
