name: Native UI

on:
  push:
    paths:
      - '.github/workflows/native-ui.yml'
      - 'pkg/customui/**'
      - 'automation/custom_ui*'
      - 'automation/floating_window*'
      - 'tests/runtime-api/custom-ui*'
      - 'tests/custom-ui/**'
      - 'scripts/build_windows_ui*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source for offline diagnostics
        run: git archive --format=tar HEAD | gzip > /tmp/native-ui-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-source
          path: /tmp/native-ui-source.tar.gz
          retention-days: 3
  customui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native UI internal seams
        run: go test ./pkg/customui/...
      - name: Build Windows UI host when present
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path scripts/build_windows_ui.ps1) {
            & ./scripts/build_windows_ui.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
