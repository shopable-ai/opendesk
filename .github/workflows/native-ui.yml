name: Native UI

on:
  push:
    paths:
      - '.github/workflows/native-ui.yml'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/opendesk/**'
      - 'cmd/opendesk-ui-host/**'
      - 'apps/opendesk/recorder/**'
      - 'internal/processlock/**'
      - 'internal/recorderbundle/**'
      - 'pkg/execution/**'
      - 'pkg/runtimeconfig/**'
      - 'pkg/customui/**'
      - 'pkg/appshell/**'
      - 'pkg/http/**'
      - 'pkg/scheduler/**'
      - 'automation/custom_ui*'
      - 'automation/floating_window*'
      - 'automation/page.go'
      - 'automation/utils.go'
      - 'automation/command*'
      - 'tests/runtime-api/custom-ui*'
      - 'tests/custom-ui/**'
      - 'tests/scheduler/**'
      - 'examples/custom-ui/**'
      - 'workflows/human-to-recipe/**'
      - 'scripts/build_windows*'
      - 'scripts/build_macos_app.sh'
      - 'docs/architecture/scheduler-runtime-concurrency.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Test Scheduler store concurrency
        if: runner.os != 'Linux'
        run: go test ./pkg/scheduler ./tests/scheduler -count=1
      - name: Run Scheduler multi-runtime ownership harness
        if: runner.os != 'Linux'
        run: go run ./tests/scheduler/tools/multiruntime
      - name: Race-test Scheduler ownership harness on macOS
        if: runner.os == 'macOS'
        run: go run -race ./tests/scheduler/tools/multiruntime
      - name: Build paired Runtime (platform assembly compile gate)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go build -o dist/opendesk.exe ./cmd/opendesk
          else
            go build -o dist/opendesk ./cmd/opendesk
          fi
      - name: Test Runtime endpoint allocation seams
        if: runner.os != 'Linux'
        run: go test ./cmd/opendesk -run 'Test(FrameworkHTTPAutoAllocation|ExplicitEndpoint|RuntimeEndpoint|FrameworkHTTPExplicit|ResolveRuntimeEndpointConfig)' -count=1
      - name: Test Inspector runtime endpoint propagation
        if: runner.os != 'Linux'
        run: go test ./pkg/http -run 'TestInspectorNetworkPolicyUsesOwnerProvidedRuntimePort' -count=1
      - name: Test App Shell single-instance seams
        if: runner.os != 'Linux'
        run: go test ./pkg/appshell -run 'SingleInstance' -count=1
      - name: Test App Package contract
        if: runner.os != 'Linux'
        run: go test ./pkg/appshell -run '^Test(ParseManifest|Manifest|LoadPackage|PackageError|RuntimeCompatibility|RuntimeVersion|MacOSTemplateIcon|WindowsTrayIcon)' -count=1
      - name: Test native UI internal seams
        run: go test ./pkg/customui/...
      - name: Test test-architecture invariants
        run: node scripts/audit_test_architecture.js
      - name: Test Script Runner controller and product composition
        run: node --test tests/custom-ui/script-runner-simple.test.js tests/custom-ui/product-script-runner.test.js
      - name: Test Recorder controller and history
        run: node --test tests/custom-ui/recording-history.test.js tests/custom-ui/recording-history-icon-adapter.test.js tests/custom-ui/recording-history-interaction.test.js tests/custom-ui/recording-history-pagination.test.js tests/custom-ui/recording-history-presentation.test.js
      - name: Build macOS native UI host
        if: runner.os == 'macOS'
        run: go build -o dist/opendesk-ui-host ./cmd/opendesk-ui-host
      - name: Build Windows native UI host
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows_ui.ps1
      - name: macOS native host protocol smoke
        if: runner.os == 'macOS'
        run: node tests/custom-ui/tools/native-host-smoke.cjs dist/opendesk-ui-host
      - name: Windows hosted-deterministic native host protocol smoke
        if: runner.os == 'Windows'
        run: node tests/custom-ui/tools/native-host-smoke.cjs dist/ui-host/opendesk-ui-host.exe --profile=hosted-deterministic
      - name: Script Runner real child stop lifecycle
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bin=./dist/opendesk.exe; else bin=./dist/opendesk; fi
          "$bin" -script tests/custom-ui/script-runner-simple-runtime.js -console-mode script -log-dir .runtime/tests/script-runner-simple/runtime-parent
      - name: Public Runtime notification contract
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bin=./dist/opendesk.exe; else bin=./dist/opendesk; fi
          "$bin" -no-ui -script tests/runtime-api/custom-ui-notify-disabled.js -console-mode script
          "$bin" -ui -script tests/runtime-api/custom-ui-notify.js -console-mode script
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-checks-${{ runner.os }}
          path: |
            .runtime/tests/native-ui
            .runtime/tests/script-runner-simple
          if-no-files-found: ignore
          retention-days: 7
