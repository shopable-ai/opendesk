name: Native UI

on:
  push:
    paths:
      - '.github/workflows/native-ui.yml'
      - 'pkg/customui/**'
      - 'automation/custom_ui*'
      - 'automation/floating_window*'
      - 'automation/page.go'
      - 'tests/runtime-api/custom-ui*'
      - 'tests/custom-ui/**'
      - 'examples/custom-ui/**'
      - 'scripts/build_windows*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Test native UI internal seams
        run: go test ./pkg/customui/...
      - name: Test test-architecture invariants
        run: node scripts/audit_test_architecture.js
      - name: Build macOS native UI host
        if: runner.os == 'macOS'
        run: go build -o dist/opendesk-ui-host ./cmd/opendesk-ui-host
      - name: Build Windows native UI host
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows_ui.ps1
      - name: macOS native host protocol smoke
        if: runner.os == 'macOS'
        run: node tests/custom-ui/tools/native-host-smoke.cjs dist/opendesk-ui-host
      - name: Windows native host protocol smoke
        if: runner.os == 'Windows'
        run: node tests/custom-ui/tools/native-host-smoke.cjs dist/ui-host/opendesk-ui-host.exe
      - name: Build paired Runtime
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go build -o dist/opendesk.exe ./cmd/opendesk
          else
            go build -o dist/opendesk ./cmd/opendesk
          fi
      - name: Public Runtime notification contract
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bin=./dist/opendesk.exe; else bin=./dist/opendesk; fi
          "$bin" -no-ui -script tests/runtime-api/custom-ui-notify-disabled.js -console-mode script
          "$bin" -ui -script tests/runtime-api/custom-ui-notify.js -console-mode script
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-checks-${{ runner.os }}
          path: .runtime/tests/native-ui
          if-no-files-found: ignore
          retention-days: 7
