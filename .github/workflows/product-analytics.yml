name: Product Analytics

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/product-analytics.yml'
      - 'go.mod'
      - 'go.sum'
      - 'configs/product.json'
      - 'pkg/productanalytics/**'
      - 'pkg/inspector/**'
      - 'automation/recorder*.go'
      - 'pkg/inspector/**'
      - 'automation/recorder*.go'
      - 'pkg/officialconfig/**'
      - 'internal/officialassets/**'
      - 'internal/flowcli/**'
      - 'cmd/opendesk/**'
      - 'apps/opendesk/**'
      - 'tests/product-analytics/**'
      - 'tests/runtime-api/product-analytics*.js'
      - 'tests/app-lifecycle/settings-privacy-controller.test.js'
      - 'docs/architecture/product-analytics.md'
  pull_request:
    paths:
      - '.github/workflows/product-analytics.yml'
      - 'go.mod'
      - 'go.sum'
      - 'configs/product.json'
      - 'pkg/productanalytics/**'
      - 'pkg/officialconfig/**'
      - 'internal/officialassets/**'
      - 'internal/flowcli/**'
      - 'cmd/opendesk/**'
      - 'apps/opendesk/**'
      - 'tests/product-analytics/**'
      - 'tests/runtime-api/product-analytics*.js'
      - 'tests/app-lifecycle/settings-privacy-controller.test.js'
      - 'docs/architecture/product-analytics.md'
  workflow_dispatch:

concurrency:
  group: product-analytics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-and-js-contract:
    name: Module and JavaScript Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go module graph is read-only complete
        run: go list -mod=readonly ./pkg/productanalytics ./pkg/officialconfig ./internal/flowcli ./cmd/opendesk ./pkg/execution ./pkg/appshell
      - name: Product Analytics JavaScript contracts
        run: >-
          node --test
          tests/product-analytics/runner-ui-dedupe.test.cjs
          tests/product-analytics/privacy-settings.test.cjs
          tests/product-analytics/developer-diagnostics.test.cjs
          tests/app-lifecycle/settings-privacy-controller.test.js

  production-contract:
    name: Production Contract
    needs: module-and-js-contract
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: >-
          go test
          ./pkg/productanalytics
          ./pkg/officialconfig
          ./internal/flowcli
          ./cmd/opendesk
          ./pkg/execution
          ./pkg/appshell
          -count=1
      - name: Build OpenDesk Runtime
        run: |
          mkdir -p dist
          go build -o dist/opendesk ./cmd/opendesk
      - name: Runtime third-party isolation
        run: ./dist/opendesk -script tests/runtime-api/product-analytics-isolation.js -console-mode script
