name: Flow Commercial Qualification

on:
  push:
    branches:
      - master
    paths:
      - 'pkg/flowpackage/**'
      - 'pkg/flowinstall/**'
      - 'pkg/flowmarketplace/**'
      - 'pkg/officialconfig/**'
      - 'pkg/appdata/**'
      - 'configs/product.json'
      - 'pkg/execution/**'
      - 'pkg/customui/winhost/**'
      - 'internal/flowcli/**'
      - 'internal/packagecli/**'
      - 'cmd/opendesk/**'
      - 'tests/runtime-api/flow-package.js'
      - 'tests/runtime-api/flow-distribution.js'
      - 'tests/runtime-api/flow-installation.js'
      - 'tests/fixtures/flow-install-test/**'
      - 'tests/runtime-api/support/flow-package-harness.js'
      - 'tests/prototypes/marketplace.test.cjs'
      - 'tests/prototypes/marketplace-local.test.cjs'
      - 'tests/prototypes/marketplace-local-server.test.mjs'
      - 'tests/prototypes/marketplace-local-manual.test.mjs'
      - 'tests/prototypes/tools/marketplace-local-server.mjs'
      - 'tests/prototypes/tools/marketplace-local-manual.mjs'
      - 'tests/prototypes/marketplace-smoke.py'
      - 'apps/opendesk/prototypes/marketplace/**'
      - 'examples/flow-distribution/**'
      - 'tests/runtime-api/gates/**'
      - 'scripts/test_runtime_apis.js'
      - 'scripts/build_windows_distribution.ps1'
      - 'scripts/build_windows_ui.ps1'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/flow-commercial.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-commercial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-prototype:
    name: Marketplace prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
      - name: Run Marketplace prototype and static distribution contract tests
        run: >-
          node --test
          tests/prototypes/marketplace.test.cjs
          tests/prototypes/marketplace-local.test.cjs
          tests/prototypes/marketplace-local-server.test.mjs
          tests/prototypes/marketplace-local-manual.test.mjs
      - name: Install browser smoke dependency
        run: python -m pip install --disable-pip-version-check playwright
      - name: Run Marketplace Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No system Chromium/Chrome found on runner" >&2
            exit 1
          fi
          python tests/prototypes/marketplace-smoke.py --set-content --browser-executable "$browser"
      - name: Upload Marketplace prototype evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-prototype-evidence
          path: .runtime/tests/marketplace-prototype
          if-no-files-found: warn
          retention-days: 7

  owners:
    name: B0+B1+Marketplace portable owners
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux Flow build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxtst-dev
      - name: Test canonical package, installer, Marketplace, app-data, execution and CLI owners
        shell: bash
        run: |
          mkdir -p .runtime/tests
          set -o pipefail
          {
            go test ./pkg/flowpackage ./pkg/flowinstall ./pkg/flowmarketplace ./pkg/officialconfig ./pkg/appdata -count=1
            go test ./cmd/opendesk -run '^TestMarketplace(Development|Product)' -count=1
          } 2>&1 | tee .runtime/tests/flow-commercial-go-test.log
      - name: Upload portable Flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-commercial-portable-evidence
          path: .runtime/tests/flow-commercial-go-test.log
          if-no-files-found: warn
          retention-days: 7

  macos-runtime:
    name: B0+B1+Marketplace / macOS Runtime
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Marketplace contract and vertical-slice tests
        run: go test ./pkg/flowmarketplace -count=1
      - name: Build current OpenDesk through repository build owner
        run: make build
      - name: Run B0 direct Runtime test
        run: ./dist/opendesk -script tests/runtime-api/flow-package.js -console-mode script
      - name: Run B0 formal Runtime gate
        run: OPENDESK_RUNTIME_API_MODE=flow-package ./dist/opendesk -script scripts/test_runtime_apis.js -console-mode script
      - name: Run existing Flow distribution regression
        run: OPENDESK_RUNTIME_API_BINARY="$PWD/dist/opendesk" ./dist/opendesk -script tests/runtime-api/flow-distribution.js -console-mode script
      - name: Run B1 direct Runtime test
        run: ./dist/opendesk -script tests/runtime-api/flow-installation.js -console-mode script
      - name: Run B1 formal Runtime gate
        run: OPENDESK_RUNTIME_API_MODE=flow-installation ./dist/opendesk -script scripts/test_runtime_apis.js -console-mode script
      - name: Upload macOS Flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-commercial-macos-evidence
          path: .runtime/tests
          if-no-files-found: ignore
          retention-days: 7

  windows-runtime:
    name: B0+B1+Marketplace / Windows Runtime
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up .NET for the maintained Windows distribution build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run Marketplace contract and vertical-slice tests
        shell: pwsh
        run: go test ./pkg/flowmarketplace -count=1
      - name: Build current OpenDesk through repository Windows distribution owner
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build_windows_distribution.ps1 -Runtime win-x64
      - name: Run B0 direct Runtime test
        shell: pwsh
        run: |
          $runtime = '.\dist\windows\win-x64\opendesk.exe'
          & $runtime -script 'tests/runtime-api/flow-package.js' -console-mode script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run B0 formal Runtime gate
        shell: pwsh
        run: |
          $runtime = '.\dist\windows\win-x64\opendesk.exe'
          $env:OPENDESK_RUNTIME_API_MODE = 'flow-package'
          & $runtime -script 'scripts/test_runtime_apis.js' -console-mode script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing Flow distribution regression
        shell: pwsh
        run: |
          $runtime = '.\dist\windows\win-x64\opendesk.exe'
          $env:OPENDESK_RUNTIME_API_BINARY = (Resolve-Path $runtime).Path
          & $runtime -script 'tests/runtime-api/flow-distribution.js' -console-mode script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run B1 direct Runtime test
        shell: pwsh
        run: |
          $runtime = '.\dist\windows\win-x64\opendesk.exe'
          & $runtime -script 'tests/runtime-api/flow-installation.js' -console-mode script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run B1 formal Runtime gate
        shell: pwsh
        run: |
          $runtime = '.\dist\windows\win-x64\opendesk.exe'
          $env:OPENDESK_RUNTIME_API_MODE = 'flow-installation'
          & $runtime -script 'scripts/test_runtime_apis.js' -console-mode script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows Flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-commercial-windows-evidence
          path: .runtime/tests
          if-no-files-found: ignore
          retention-days: 7
