name: Measurement baseline workspace
on:
  push:
    branches: [master]
    paths: ['.github/workflows/measurement-baseline-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare isolated source and test toolchain
        shell: bash
        run: |
          mkdir -p .runtime/measurement-web-workspace
          git rev-parse HEAD > .runtime/measurement-web-workspace/HEAD.txt
          git archive --format=tar.gz --output=.runtime/measurement-web-workspace/source.tar.gz HEAD
          go list -deps -test ./pkg/measurement/... ./pkg/customui/... >/dev/null
          tar -czf .runtime/measurement-web-workspace/go.tar.gz -C "$(go env GOROOT)" .
          tar -czf .runtime/measurement-web-workspace/modules.tar.gz -C "$(go env GOMODCACHE)" .
      - uses: actions/upload-artifact@v4
        with:
          name: measurement-web-toolchain
          path: .runtime/measurement-web-workspace
          retention-days: 1
          compression-level: 0
