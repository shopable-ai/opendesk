<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenDesk Flow Runner Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111214;
      --panel: rgba(29, 30, 34, 0.96);
      --panel-hover: #2a2c31;
      --border: #393b42;
      --border-soft: #2d2f35;
      --text: #f5f6f8;
      --muted: #a9adb7;
      --accent: #3f73ef;
      --accent-hover: #4b7ef3;
      --danger: #ffb3b3;
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(91,140,255,.13), transparent 28%),
        radial-gradient(circle at 76% 34%, rgba(126,87,194,.10), transparent 30%),
        linear-gradient(180deg, #17181b 0%, #101114 100%);
      color: var(--text);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }
    .desktop { position: relative; min-height: 100vh; padding: 28px; }

    .notes {
      width: min(680px, calc(100vw - 56px));
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      background: rgba(23,24,28,.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .notes h1 { margin: 0 0 8px; font-size: 20px; }
    .notes p { margin: 6px 0; color: var(--muted); }
    .notes strong { color: #e8ecf5; }
    .notes code { color: #d7e2ff; }

    .runner-shell {
      position: absolute;
      right: 22px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .popover {
      width: 322px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform-origin: right bottom;
      opacity: 0;
      transform: translateY(8px) scale(.985);
      pointer-events: none;
      transition: opacity .12s ease, transform .12s ease;
      backdrop-filter: blur(22px);
    }
    .popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .popover-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px 9px;
      border-bottom: 1px solid var(--border-soft);
    }
    .popover-title { font-size: 12px; font-weight: 700; }
    .popover-count { font-size: 11px; color: var(--muted); }

    .flow-list {
      max-height: 246px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 5px;
      scrollbar-width: thin;
    }

    .flow-row {
      width: 100%;
      min-height: 45px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 20px;
      align-items: center;
      gap: 7px;
      padding: 4px 8px 4px 7px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      outline: none;
    }
    .flow-row:hover,
    .flow-row:focus-visible { background: var(--panel-hover); }
    .flow-row.selected { background: rgba(91,140,255,.15); }
    .flow-row.selected:hover,
    .flow-row.selected:focus-visible { background: rgba(91,140,255,.21); }

    .row-index {
      width: 24px;
      text-align: center;
      color: #7f8490;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .flow-row.selected .row-index { color: #a9c0ff; }
    .row-copy { min-width: 0; }
    .row-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }
    .row-meta {
      margin-top: 1px;
      color: var(--muted);
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-check {
      width: 18px;
      color: #a9c0ff;
      text-align: center;
      font-size: 12px;
      opacity: 0;
    }
    .flow-row.selected .row-check { opacity: 1; }

    .popover-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 9px;
      border-top: 1px solid var(--border-soft);
    }
    .tip { color: var(--muted); font-size: 10px; }

    .manager-btn,
    .icon-btn,
    .flow-selector {
      border: 1px solid var(--border);
      background: #2a2b30;
      color: var(--text);
      outline: none;
    }
    .manager-btn:hover,
    .icon-btn:hover:not(:disabled),
    .flow-selector:hover:not(:disabled) {
      background: #34363d;
      border-color: #50535d;
    }

    .manager-btn {
      height: 29px;
      padding: 0 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      user-select: none;
    }

    .toolbar-divider {
      width: 1px;
      height: 22px;
      margin: 0 1px;
      background: var(--border-soft);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }
    .icon-btn:disabled,
    .flow-selector:disabled { opacity: .35; cursor: default; }
    .icon-btn.primary {
      background: var(--accent);
      border-color: #6390ff;
    }
    .icon-btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
    .icon-btn.stop.running { color: var(--danger); border-color: rgba(255,107,107,.55); }

    .play-glyph {
      width: 0;
      height: 0;
      margin-left: 2px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid currentColor;
    }
    .stop-glyph { width: 11px; height: 11px; border-radius: 1px; background: currentColor; }
    .nav-glyph {
      width: 8px;
      height: 8px;
      border-top: 1.6px solid currentColor;
      border-right: 1.6px solid currentColor;
    }
    .nav-glyph.prev { transform: rotate(-135deg); margin-left: 3px; }
    .nav-glyph.next { transform: rotate(45deg); margin-right: 3px; }

    .flow-selector {
      height: 34px;
      width: 186px;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0,1fr) 20px;
      align-items: center;
      gap: 2px;
      padding: 0 7px 0 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .selector-copy { min-width: 0; }
    .selector-label {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 650;
    }
    .selector-state {
      display: block;
      margin-top: -1px;
      color: var(--muted);
      font-size: 9px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .selector-chevron {
      width: 7px;
      height: 7px;
      margin: 0 auto 3px;
      border-right: 1.5px solid #aeb3be;
      border-bottom: 1.5px solid #aeb3be;
      transform: rotate(45deg);
      transition: transform .12s ease, margin .12s ease;
    }
    .flow-selector.open .selector-chevron {
      margin: 3px auto 0;
      transform: rotate(225deg);
    }

    .status-toast {
      position: absolute;
      right: 22px;
      bottom: 78px;
      max-width: 390px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(24,25,29,.94);
      color: #d7dae1;
      font-size: 11px;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: .14s ease;
    }
    .status-toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <main class="desktop" id="desktop">
    <section class="notes">
      <h1>Flow Runner · Compact Selector · Main Prototype</h1>
      <p><strong>主工具条：</strong><code>运行 → 停止 → 上一个 → 当前流程 → 下一个</code>。运行/停止保持稳定主操作，流程导航形成独立一组。</p>
      <p><strong>选择与执行分离：</strong>点击选择器里的流程只切换当前流程，不直接运行；真正执行始终回到工具条“运行”，降低误触错误自动化的风险。</p>
      <p><strong>视觉消歧：</strong>上一项/下一项使用细线 chevron，不再与“运行”的实心播放三角混淆。完整排序、多选、批量运行继续进入“管理流程…”。</p>
    </section>

    <div class="status-toast" id="toast" aria-live="polite"></div>

    <section class="runner-shell" aria-label="OpenDesk Flow Runner 原型">
      <div class="popover" id="popover" role="dialog" aria-label="选择流程">
        <div class="popover-head">
          <span class="popover-title">选择当前流程</span>
          <span class="popover-count" id="flowCount">8 个流程</span>
        </div>
        <div class="flow-list" id="flowList" aria-label="流程列表"></div>
        <div class="popover-foot">
          <span class="tip">点击只切换，不会自动运行</span>
          <button class="manager-btn" id="managerBtn" type="button">管理流程…</button>
        </div>
      </div>

      <div class="toolbar" aria-label="Flow Runner 工具条">
        <button class="icon-btn primary" id="runBtn" type="button" title="运行当前流程" aria-label="运行当前流程"><span class="play-glyph" aria-hidden="true"></span></button>
        <button class="icon-btn stop" id="stopBtn" type="button" title="停止运行" aria-label="停止运行" disabled><span class="stop-glyph" aria-hidden="true"></span></button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="icon-btn" id="prevBtn" type="button" title="上一个流程" aria-label="上一个流程"><span class="nav-glyph prev" aria-hidden="true"></span></button>

        <button class="flow-selector" id="selectorBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span class="selector-copy">
            <span class="selector-label" id="selectorLabel">daily-report.js</span>
            <span class="selector-state" id="selectorState">1 / 8 · 就绪</span>
          </span>
          <span class="selector-chevron" aria-hidden="true"></span>
        </button>

        <button class="icon-btn" id="nextBtn" type="button" title="下一个流程" aria-label="下一个流程"><span class="nav-glyph next" aria-hidden="true"></span></button>
      </div>
    </section>
  </main>

  <script>
    const flows = [
      { name: 'daily-report.js', meta: '日报汇总' },
      { name: 'wechat-customer-followup.js', meta: '微信客户跟进' },
      { name: 'invoice-export.js', meta: '发票导出' },
      { name: 'crm-sync.js', meta: 'CRM 同步' },
      { name: 'inventory-check.js', meta: '库存检查' },
      { name: 'order-reconcile.js', meta: '订单对账' },
      { name: 'screenshot-archive.js', meta: '截图归档' },
      { name: 'browser-login-check.js', meta: '登录状态检查' },
    ];

    let currentIndex = 0;
    let runningIndex = -1;
    let popoverOpen = false;
    let runTimer = null;
    let toastTimer = null;

    const popover = document.getElementById('popover');
    const flowList = document.getElementById('flowList');
    const selectorBtn = document.getElementById('selectorBtn');
    const selectorLabel = document.getElementById('selectorLabel');
    const selectorState = document.getElementById('selectorState');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const runBtn = document.getElementById('runBtn');
    const stopBtn = document.getElementById('stopBtn');
    const managerBtn = document.getElementById('managerBtn');
    const toast = document.getElementById('toast');
    const flowCount = document.getElementById('flowCount');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1700);
    }

    function selectedStateText() {
      if (runningIndex === currentIndex) return '运行中';
      if (runningIndex >= 0) return `正在运行 ${runningIndex + 1}/${flows.length}`;
      return '就绪';
    }

    function renderList() {
      flowList.innerHTML = '';
      flows.forEach((flow, index) => {
        const row = document.createElement('button');
        row.className = 'flow-row' + (index === currentIndex ? ' selected' : '');
        row.type = 'button';
        row.setAttribute('aria-pressed', String(index === currentIndex));
        row.title = `切换到 ${flow.name}`;

        const idx = document.createElement('span');
        idx.className = 'row-index';
        idx.textContent = String(index + 1).padStart(2, '0');

        const copy = document.createElement('span');
        copy.className = 'row-copy';
        const name = document.createElement('span');
        name.className = 'row-name';
        name.textContent = flow.name;
        const meta = document.createElement('span');
        meta.className = 'row-meta';
        meta.textContent = index === runningIndex ? '正在运行…' : flow.meta;
        copy.append(name, meta);

        const check = document.createElement('span');
        check.className = 'row-check';
        check.textContent = '✓';
        check.setAttribute('aria-hidden', 'true');

        row.append(idx, copy, check);
        row.addEventListener('click', () => selectFlow(index));
        flowList.appendChild(row);
      });
    }

    function render() {
      const hasFlows = flows.length > 0;
      const running = runningIndex >= 0;
      if (hasFlows) {
        selectorLabel.textContent = flows[currentIndex].name;
        selectorLabel.title = flows[currentIndex].name;
        selectorState.textContent = `${currentIndex + 1} / ${flows.length} · ${selectedStateText()}`;
      } else {
        selectorLabel.textContent = '暂无流程';
        selectorState.textContent = '0 / 0';
      }

      if (running && popoverOpen) popoverOpen = false;
      selectorBtn.classList.toggle('open', popoverOpen);
      selectorBtn.setAttribute('aria-expanded', String(popoverOpen));
      popover.classList.toggle('open', popoverOpen);

      runBtn.disabled = !hasFlows || running;
      stopBtn.disabled = !running;
      stopBtn.classList.toggle('running', running);
      prevBtn.disabled = !hasFlows || running || flows.length < 2;
      nextBtn.disabled = !hasFlows || running || flows.length < 2;
      selectorBtn.disabled = !hasFlows || running;
      managerBtn.disabled = false;
      flowCount.textContent = `${flows.length} 个流程`;
      renderList();
    }

    function setPopover(open) {
      if (runningIndex >= 0 && open) return;
      popoverOpen = open;
      render();
      if (open) {
        requestAnimationFrame(() => {
          const selected = flowList.querySelector('.flow-row.selected');
          if (selected) selected.scrollIntoView({ block: 'nearest' });
        });
      }
    }

    function selectFlow(index) {
      if (runningIndex >= 0 || index < 0 || index >= flows.length) return;
      currentIndex = index;
      setPopover(false);
      showToast(`已选择：${flows[currentIndex].name}`);
    }

    function step(delta) {
      if (runningIndex >= 0 || flows.length < 2) return;
      currentIndex = (currentIndex + delta + flows.length) % flows.length;
      render();
      showToast(`已选择：${flows[currentIndex].name}`);
    }

    function startRun() {
      if (runningIndex >= 0 || flows.length === 0) return;
      runningIndex = currentIndex;
      setPopover(false);
      render();
      showToast(`开始运行：${flows[runningIndex].name}`);
      clearTimeout(runTimer);
      runTimer = setTimeout(() => {
        const finished = flows[runningIndex]?.name;
        runningIndex = -1;
        render();
        showToast(`运行完成：${finished}`);
      }, 4200);
    }

    function stopRun() {
      if (runningIndex < 0) return;
      const stopped = flows[runningIndex].name;
      clearTimeout(runTimer);
      runningIndex = -1;
      render();
      showToast(`已停止：${stopped}`);
    }

    selectorBtn.addEventListener('click', () => setPopover(!popoverOpen));
    prevBtn.addEventListener('click', () => step(-1));
    nextBtn.addEventListener('click', () => step(1));
    runBtn.addEventListener('click', startRun);
    stopBtn.addEventListener('click', stopRun);
    managerBtn.addEventListener('click', () => {
      setPopover(false);
      showToast('原型：打开现有完整“流程列表 / 管理流程”窗口');
    });

    document.addEventListener('pointerdown', event => {
      if (!popoverOpen) return;
      if (popover.contains(event.target) || selectorBtn.contains(event.target)) return;
      setPopover(false);
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && popoverOpen) setPopover(false);
    });

    render();
  </script>
</body>
</html>
