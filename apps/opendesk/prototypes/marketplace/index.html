function launch(id){close();model.request(id,{platform:state.device,scenario:state.scenario});handoff();}
function handoff(){const a=model.active,f=model.find(a.id);show('网页 → 桌面 · 交接演示',heading(a.scenario==='noapp'?'还没有安装 OpenDesk？':'在 OpenDesk 中继续','网页只能发起安装意图。是否在本机安装，需要到 OpenDesk 中再次确认。')+'<div class="row" style="margin-bottom:18px">'+tile(f)+'<div><strong>'+f.name+'</strong><div class="small muted">v'+a.version+' · '+f.publisher+'</div></div></div><div class="note">此原型不会发送请求或打开客户端；点击下方按钮只是切换到桌面安装界面的演示。</div><details><summary>查看 ID-only 安装意图（不可用于真实安装）</summary><code>'+esc(model.intent(a.token))+'</code></details>'+(a.scenario==='unconfirmed'?'<div class="note warning" style="margin-top:15px">未收到客户端响应 ≠ 客户端未安装。正式网页只能提示你重试或手动继续，不能靠超时声称安装成功。</div>':'')+'<div class="dialog-actions">'+action('手动安装方式','manual')+action(a.scenario==='noapp'?'模拟装好客户端后继续':'演示：切换到桌面确认',a.scenario==='noapp'?'client-ready':'accept',true)+'</div>');}
function confirm(){const a=model.active,f=model.find(a.id),ok=model.compatible(a.token),entitled=model.entitled(f.id);const old=model.state.catalog[f.id];show('OpenDesk 桌面 · 本地安装确认 · 模拟',heading(a.update?'确认更新 Flow':'确认安装 Flow','浏览器的安装请求不是授权。请核对具体版本、适用系统和所需权限。')+'<div class="row">'+tile(f)+'<div><strong>'+f.name+'</strong><div class="small muted">'+(a.update?'v'+old.version+' → ':'')+'v'+a.version+' · '+f.platforms.join(' / ')+'</div></div></div><dl class="facts"><div><dt>发布者</dt><dd>'+f.publisher+'</dd></div><div><dt>当前演示系统</dt><dd>'+a.platform+'</dd></div><div><dt>使用授权</dt><dd>'+ (f.policy==='free'?'免费':entitled?'已获得 · 模拟':'尚未取得 · 不会下载包')+'</dd></div></dl>'+(!ok?'<div class="note error">不兼容：此 Flow 不支持 '+a.platform+'。请取消后在演示设置中切换系统。</div>':'')+(a.update?'<div class="note warning">更新案例新增权限：递归读取所选目录的子文件夹。需要你重新确认，不会自动更新。</div>':'')+f.permissions.map(x=>'<div class="check-row">'+icon('shield')+'<span>'+x+'</span></div>').join('')+'<label class="choice"><input type="checkbox" id="permissions"><span>我已查看并同意本次所需权限<small>这不代表信任发布者的其他 Flow，也不会自动运行。</small></span></label>'+(!entitled?'<div class="note warning" style="margin-top:14px">付费 Flow 需要先取得授权。演示不会扣费；模拟授权后仍需单独确认安装。</div>':'')+'<div class="dialog-actions">'+action('取消','close')+action(entitled?'确认安装（模拟）':'查看授权示例',entitled?'begin':'license',true,entitled?'id="confirm-install" disabled':'')+'</div>');$('#permissions').addEventListener('change',()=>{const b=$('#confirm-install');if(b)b.disabled=!$('#permissions').checked||!ok;});}
function license(){const a=model.active,f=model.find(a.id);show('使用授权 · 模拟 · 不会扣费',heading('先取得使用授权','购买、安装和运行是三个独立动作。这里仅演示授权状态的变化。')+'<div class="panel"><h3>'+f.name+'</h3><p class="muted" style="margin:10px 0">'+f.price+'</p><p class="small muted">不是实际价格或支付页面。不会调用收银台、创建订单或收集账号凭证。</p></div><div class="dialog-actions">'+action('返回确认','confirm')+action('模拟取得授权','grant',true)+'</div>');}
function verify(){const a=model.active;model.begin(a.token,$('#permissions').checked);show('OpenDesk 桌面 · 校验过程 · 模拟',heading('正在校验安装包','以下是状态演示，不是实际网络下载或密码学校验。')+'<div class="progress-list"><div class="progress-step done">'+icon('check')+'安装意图与 Release 身份</div><div class="progress-step"><span class="spinner"></span>下载 .odflow 并校验摘要与签名</div><div class="progress-step muted">等待本机信任确认</div></div><div class="dialog-actions">'+action('取消安装','close')+'</div>');timer=setTimeout(()=>{if(!model.active||model.active.token!==a.token)return;if(model.verified(a.token))trust();else failure();},550);}
function trust(){const a=model.active,f=model.find(a.id);const existing=model.state.trust[model.publisherKey(f)]||model.state.trust[model.flowKey(f)];show('OpenDesk 桌面 · 本机信任 · 模拟',heading(existing?'确认本次安装':'是否允许安装这个 Flow？','示例安装包校验已通过。市场的发布者验证，不会替你扩大本机信任范围。')+'<div class="note">'+(f.verified?'市场已验证发布者（示例）':'市场未验证发布者（示例）')+'<br>本机信任：'+(existing?'已有明确的模拟授权，仍不会自动运行。':'尚未批准。需要你明确选择。')+'</div><label class="choice"><input type="radio" name="scope" value="flow" checked><span><strong>仅批准这个 Flow</strong><small>只为当前 Flow 建立本机信任，不批准此发布者的其他 Flow。</small></span></label><details><summary>高级选项：扩大信任范围</summary><label class="choice"><input type="radio" name="scope" value="publisher"><span>信任此发布者<small>范围更广：其其他 Flow 的相同签名身份也可复用该信任。</small></span></label><label class="choice"><input type="checkbox" id="broad"><span>我理解这是对发布者范围的授权</span></label></details><p class="small muted" style="margin-top:16px">实际实现还必须核对签名身份、Manifest、Inventory 与授权。这里不生成真实信任记录。</p><div class="dialog-actions">'+action('取消','close')+action('批准此 Flow 并安装','commit',true,'id="commit-button"')+'</div>');$('#dialog-body').onchange=updateScope;function updateScope(){const broad=$('input[name="scope"]:checked').value==='publisher';$('#commit-button').textContent=broad?'信任发布者并安装':'批准此 Flow 并安装';$('#commit-button').disabled=broad&&!$('#broad').checked;}}
function commit(){const a=model.active,scope=$('input[name="scope"]:checked').value,broad=$('#broad').checked;if(!model.commit(a.token,scope,broad)){failure();return;}side();installed();}
function installed(){const a=model.active,f=model.find(a.id);show('OpenDesk 桌面 · 安装结果 · 模拟','<div class="result-icon">'+icon('check')+'</div>'+heading(a.update?'更新完成，尚未运行':'安装完成，尚未运行',f.name+' v'+a.version+' 已写入本原型的模拟记录。没有执行任何业务代码。')+'<div class="note">下一步：在 Flow Runner 中查看 → 配置业务输入 → 由你明确点击运行。<br>'+(!model.storageOK?'浏览器存储不可用，本次仅保存在内存。':'模拟记录只保存在当前浏览器的专用演示存储中。')+'</div><div class="dialog-actions">'+action('完成','finish')+action('在 Flow Runner 中查看（演示）','finish-local',true)+'</div>');}
function failure(){const a=model.active;const messages={network:['网络连接中断','未完成下载，没有新增或替换本机模拟记录。恢复后需要重新发起。'],integrity:['安装包校验失败','摘要或签名不匹配，已阻止安装。没有“仍然安装”的绕过按钮。'],revoked:['此版本已撤回','该 Release 不再允许新安装。请返回详情选择有效版本。'],writefail:['安装写入失败','事务失败已回滚，原有版本与信任记录保持不变。']};const m=messages[a.scenario]||['安装未完成','操作已停止。'];show('OpenDesk 桌面 · 已阻止安装 · 模拟',heading(m[0],m[1])+'<div class="note error">不会注册为安装成功，也不会触发运行。此处为故障场景演示。</div><div class="dialog-actions">'+action('关闭','finish')+'</div>');}
function settings(){show('仅影响此原型',heading('演示设置','切换场景以检查边界行为。设置在下一次发起安装时生效。')+'<div class="settings-fields"><div class="field"><label for="device">当前演示系统（不检测你的真实设备）</label><select id="device"><option>macOS</option><option>Windows</option></select></div><div class="field"><label for="scenario">安装场景</label><select id="scenario"><option value="normal">正常安装</option><option value="noapp">尚未安装 OpenDesk</option><option value="unconfirmed">网页未收到唤起确认</option><option value="network">下载时网络中断</option><option value="integrity">摘要或签名校验失败</option><option value="revoked">Release 已撤回</option><option value="writefail">事务写入失败</option></select></div></div><div class="divider"></div><div class="row wrap">'+action('载入旧版本更新案例','seed')+action('重置演示数据','reset-question')+'</div><div class="dialog-actions">'+action('保存设置','save-settings',true)+'</div>');$('#device').value=state.device;$('#scenario').value=state.scenario;}
function guide(manual=false){show('安装方式 · 产品设计示例',heading(manual?'手动安装 .odflow':'从发现到使用，只需三步','无论从网页、文件双击或拖入开始，真实安装都应进入同一个 OpenDesk 安装内核。')+'<div class="progress-list"><div class="progress-step"><strong>01</strong>安装 OpenDesk，并从受信来源取得真实 .odflow 文件。</div><div class="progress-step"><strong>02</strong>双击、拖入或选择文件；在 OpenDesk 中完成签名、权限、信任与授权确认。</div><div class="progress-step"><strong>03</strong>在 Flow Runner 配置输入，然后明确点击运行。</div></div><div class="note warning">本原型不提供客户端或有效 .odflow 下载，也不创建伪造安装包。正式下载入口应从产品配置取得。</div><div class="dialog-actions">'+action(model.active?'返回安装演示':'明白了',model.active?'handoff':'close',true)+'</div>');}
function refresh(){if(screen==='local')local();else if(screen==='detail')detail(detailId);else market();}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id,v=b.dataset.value;try{switch(a){case'home':navigate('');break;case'local':close();navigate('local');break;case'detail':state.tab='overview';navigate('flow/'+id);break;case'category':state.category=v;screen='market';if(location.hash&&location.hash!=='#')navigate('');else market();break;case'platform':state.platform=v;market();$('#browse-section').scrollIntoView({block:'start'});break;case'clearfilters':Object.assign(state,{q:'',platform:'all',price:'all',category:'全部自动化'});market();break;case'browse':$('#browse-section').scrollIntoView({behavior:'smooth'});$('#search').focus({preventScroll:true});break;case'tab':state.tab=v;detail(detailId);break;case'install':launch(id);break;case'accept':model.accept(model.active.token);if(model.active.phase==='error')failure();else confirm();break;case'client-ready':model.clientReady(model.active.token);model.accept(model.active.token);confirm();break;case'confirm':confirm();break;case'license':license();break;case'grant':model.grant(model.active.token);confirm();break;case'begin':verify();break;case'commit':commit();break;case'close':close();break;case'finish':close();refresh();break;case'finish-local':close();navigate('local');break;case'handoff':handoff();break;case'manual':guide(true);break;case'guide':guide();break;case'settings':settings();break;case'save-settings':state.device=$('#device').value;state.scenario=$('#scenario').value;close();toast('已更新演示设置，下次安装生效');break;case'seed':close();model.seedUpdate();state.scenario='normal';state.device='macOS';navigate('local');toast('已载入旧版模拟记录；没有安装任何真实 Flow');break;case'run':show('Flow Runner · 显式运行 · 模拟',heading('运行 '+model.find(id).name+'？','本次只增加模拟运行记录，不会操作桌面、访问网页或处理文件。')+'<div class="note">正式产品在这里仍需完成业务输入、运行授权与执行确认。</div><div class="dialog-actions">'+action('取消','close')+action('确认模拟运行','run-confirm',true,'data-id="'+id+'"')+'</div>');break;case'run-confirm':model.run(id);close();local();toast('模拟运行完成；没有执行真实自动化');break;case'remove':show('仅删除原型数据',heading('移除这个模拟记录？','不会卸载真实设备上的任何 Flow。发布者范围的信任和授权不会被隐式撤销。')+'<div class="dialog-actions">'+action('取消','close')+action('确认移除','remove-confirm',true,'data-id="'+id+'"')+'</div>');break;case'remove-confirm':model.remove(id);close();local();break;case'reset-question':show('仅清除专用演示存储',heading('重置演示数据？','只清除本原型的安装、信任和授权记录，不清除浏览器其他数据。')+'<div class="dialog-actions">'+action('取消','close')+action('确认重置','reset',true)+'</div>');break;case'reset':model.reset();state.device='macOS';state.scenario='normal';close();refresh();toast('演示数据已重置');break;case'publisher':show('发布者入口 · 本轮仅说明',heading('把你的 Flow 分享给更多人','正式发布需要真实 .odflow、发布者身份与不可变的 Release 记录。本轮不实现上传后台。')+'<div class="progress-list"><div class="progress-step">打包并签名 .odflow</div><div class="progress-step">提交名称、说明、兼容系统、权限与版本记录</div><div class="progress-step">服务端验证后发布 Release，用户按版本安装</div></div><div class="note">原型不接收包上传，不生成虚假“已发布”记录。发布后台、支付与更新服务仍需独立实现。</div><div class="dialog-actions">'+action('明白了','close',true)+'</div>');break;}}catch(error){toast(error.message);}});
document.addEventListener('keydown',event=>{const tab=event.target.closest('.tab');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const values=['overview','usage','versions'];let i=values.indexOf(tab.dataset.value);i=event.key==='Home'?0:event.key==='End'?2:(i+(event.key==='ArrowRight'?1:2))%3;state.tab=values[i];detail(detailId);document.querySelector('.tab[data-value="'+state.tab+'"]').focus();});
dialog.addEventListener('cancel',event=>{event.preventDefault();close();});window.addEventListener('hashchange',renderRoute);renderRoute();
})();
</script>
</body>
</html>
