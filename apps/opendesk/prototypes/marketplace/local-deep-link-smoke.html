<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenDesk Marketplace · 本地静态安装检查</title>
<style>
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:56px auto;padding:0 20px;color:#1f2937}
.card{border:1px solid #d1d5db;border-radius:14px;padding:24px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
a{color:#0f766e}.btn{display:inline-block;padding:10px 14px;border-radius:9px;background:#111827;color:white;text-decoration:none}
.note{background:#f3f4f6;border-radius:10px;padding:12px 14px}.muted{color:#6b7280}
</style>
</head>
<body>
<div class="card">
<h1>Notify Demo · 本地静态安装检查</h1>
<p>此页与主原型、<code>release.json</code>、真实 <code>.odflow</code> 由同一个静态站点提供。网页只发起 ID-only 安装请求，不判断安装成功。</p>
<div id="content" class="note">当前只是源码原型。请用仓库根目录的一条本地 Marketplace 启动命令生成本次静态站点。</div>
</div>
<!-- OPENDESK_LOCAL_RELEASE_BINDING -->
<script>
(function(){
  const node=document.getElementById('opendesk-marketplace-release');
  if(!node)return;
  let binding;try{binding=JSON.parse(node.textContent);}catch(_){return;}
  const content=document.getElementById('content');
  content.innerHTML='<div class="actions"><a class="btn" id="install" href="'+binding.deepLink+'">安装到 OpenDesk</a><a href="'+binding.releaseUrl+'">查看 release.json</a><a href="'+binding.artifactUrl+'">下载 .odflow</a></div><p class="muted" id="status">尚未请求打开客户端。安装完成也不会自动运行。</p>';
  document.getElementById('install').addEventListener('click',()=>{
    document.getElementById('status').textContent='已请求打开 OpenDesk，请在应用中完成安装。网页不推断结果；安装成功后请到 Flow Runner 另行点击运行。';
  },true);
}());
</script>
</body>
</html>
