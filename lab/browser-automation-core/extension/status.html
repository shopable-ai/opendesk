<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Core connection status</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; width: 350px; margin: 0; padding: 20px; box-sizing: border-box; color: #182230; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  p { margin: 8px 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f2f4f7; padding: 12px; border-radius: 6px; font-size: 12px; }
  button { font: inherit; padding: 6px 12px; }
</style>
<h1>Browser Automation Core Demo</h1>
<p id="summary" role="status">正在读取连接状态…</p>
<pre id="details"></pre>
<button id="refresh" type="button">刷新状态</button>
<p>READY 表示通信连接已建立；完整验收以 verify-a 报告为准。</p>
<script src="status.js"></script>
</html>
