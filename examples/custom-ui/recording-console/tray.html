<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OpenDesk 脚本录制</title>
  </head>
  <body>
    <main class="tray-shell">
      <header id="trayDrag" data-clawdesk-drag>
        <div class="brand-line">
          <span class="record-mark" aria-hidden="true"></span>
          <strong>OpenDesk 脚本录制</strong>
          <span id="trayState" class="status-pill" aria-live="polite">准备就绪</span>
        </div>
        <button id="trayClose" class="icon-button" title="关闭并停止录制" aria-label="关闭并停止录制">×</button>
      </header>

      <section class="scope-row" aria-label="录制起始上下文">
        <span class="scope-label">起始窗口上下文</span>
        <strong id="trayTarget">点击开始后 3 秒读取起始窗口</strong>
      </section>

      <section class="stage-row" aria-label="制作进度">
        <span id="trayPrepareStage" class="stage-chip is-pending">○ 准备</span>
        <span id="trayCaptureStage" class="stage-chip is-pending">○ 录制</span>
        <span id="traySaveStage" class="stage-chip is-pending">○ 保存</span>
        <span id="trayActionsStage" class="stage-chip is-pending">○ Actions</span>
        <span id="trayGenerateStage" class="stage-chip is-pending">○ 生成</span>
        <span id="trayRunStage" class="stage-chip is-pending">○ 重放</span>
      </section>

      <p id="trayDetail" class="detail-text" aria-live="polite">点击“开始录制”后，请在 3 秒内聚焦起始窗口；用于聚焦的点击不会被记录，之后可切换窗口和应用。</p>
      <p id="trayError" class="error-banner" hidden aria-live="assertive"></p>
      <div class="meta-row">
        <span id="trayCounts">accepted 0 · persisted 0 · paused 0 · dropped 0</span>
        <span id="trayArtifact">尚无录制产物。</span>
      </div>

      <footer>
        <button id="trayDetails" class="secondary-button">查看详情</button>
        <div class="action-group">
          <button id="trayReset" class="secondary-button" disabled>重置</button>
          <button id="trayCancel" class="secondary-button" disabled>取消并保存</button>
          <button id="trayPause" class="pause-button" disabled>暂停录制</button>
          <button id="trayStop" class="stop-button" disabled>停止并制作 Actions</button>
          <button id="trayGenerate" class="generate-button" disabled>生成脚本</button>
          <button id="trayRun" class="run-button" disabled>重放</button>
          <button id="trayStart" class="record-button">开始录制</button>
        </div>
      </footer>
    </main>
  </body>
</html>
